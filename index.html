function submitCompletionReport(taskId){
  var report=(document.getElementById("completion-report")||{}).value||"";
  report=report.trim();
  if(!report){toast("Describe qué hiciste para completar la tarea","error");return;}
  var t=state.tasks.find(function(x){return x.id==taskId;});
  if(!t)return;
  // Validar ubicación requerida
  if(t.requireLocation){
    // Leer ubicación seleccionada por el colaborador
    var selLocEl=document.getElementById("collab-loc-select");
    var selLocId=selLocEl?selLocEl.value:"";
    var selLoc=(state.locations||[]).find(function(l){return String(l.id)===String(selLocId);});
    if(!selLocId||!selLoc){toast("⚠️ Selecciona la ubicación donde te encuentras","error");return;}
    var cameraFiles=_evidenceFiles.filter(function(_,i){return _evidenceCoords[i]&&_evidenceCoords[i].lat;});
    if(!cameraFiles.length){toast("⚠️ Esta tarea requiere al menos una foto con ubicación GPS. Usa el botón 📷 Cámara.","error");return;}
    if(t.validateProximity){
      // Validar contra la ubicación seleccionada por el colaborador
      var refLoc=selLoc;
      var allowedRadius=t.locationRef&&t.locationRef.taskRadius||t.locationRef&&t.locationRef.radius||selLoc.radius||200;
      var outOfRange=_evidenceCoords.filter(function(c){
        if(!c||!c.lat)return false;
        return haversineMeters(c.lat,c.lng,refLoc.lat,refLoc.lng)>allowedRadius;
      });
      if(outOfRange.length>0){
        var allowedR=allowedRadius;
        var dist=Math.round(haversineMeters(outOfRange[0].lat,outOfRange[0].lng,refLoc.lat,refLoc.lng));
        var locName=escH(refLoc.name||"la referencia");
        var rejMsg="📍 Soporte rechazado por ubicación fuera de rango.\n\nFoto tomada a "+dist+"m de "+locName+".\nRadio permitido: "+allowedR+"m.\nDistancia excedida: "+(dist-allowedR)+"m.\n\n🔧 Para aprobar: ubícate dentro del radio permitido antes de tomar la foto.";
        // Registrar rechazo en historial
        if(!t.history)t.history=[];
        t.history.push({date:new Date().toLocaleDateString("es"),ts:Date.now(),result:"red",approved:false,report:"[Rechazo GPS] Foto a "+dist+"m, radio "+allowedR+"m"});
        if(t.history.length>20)t.history=t.history.slice(-20);
        // Publicar en el chat del colaborador
        var col=state.collaborators.find(function(c){return Array.isArray(t.assignedTo)?t.assignedTo.indexOf(c.id)>=0:c.id===t.assignedTo;});
        var ck=t.isGroup&&t.groupKey?t.groupKey:(col?collabCK(col.id):null);
        if(ck){
          if(!state.messages[ck])state.messages[ck]=[];
          state.messages[ck].push({id:Date.now(),from:"ai",text:rejMsg,ts:Date.now()});
        }
        // Cerrar el sheet y notificar
        var sh=document.getElementById("completion-sheet");if(sh)sh.remove();
        saveLocal();if(db)saveCloud();render();
        toast("📍 Foto fuera del radio permitido ("+dist+"m de "+locName+")","error");
        return;
      }
    }
  }
  // Agregar ubicación seleccionada al reporte
  if(t.requireLocation&&selLoc){
    report+=" [📍 Ubicación: "+selLoc.name+"]";
  }
  if(_evidenceFiles.length>0){
    var prog=document.getElementById("upload-progress");
    if(prog)prog.style.display="block";
    uploadEvidence(taskId,_evidenceFiles,_evidenceCoords,
      function(pct){var p=document.getElementById("upload-progress");if(p)p.textContent="⏳ Subiendo… "+pct+"%";},
      function(urls){
        var sh=document.getElementById("completion-sheet");if(sh)sh.remove();
        _finishSubmit(taskId,report,urls);
      },
      function(err){toast("Error al subir archivos: "+err,"error");}
    );
  }else{
    var sh=document.getElementById("completion-sheet");if(sh)sh.remove();
    _finishSubmit(taskId,report,[]);
  }
}

// ── FACE & DUPLICATE VALIDATION ──
function imgHash(url){
  return new Promise(function(resolve){
    var img=new Image();
    img.crossOrigin="anonymous";
    img.onload=function(){
      try{
        var cv=document.createElement("canvas");cv.width=8;cv.height=8;
        var ctx=cv.getContext("2d");ctx.drawImage(img,0,0,8,8);
        var d=ctx.getImageData(0,0,8,8).data;
        var gray=[];
        for(var i=0;i<64;i++)gray.push(Math.round((d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000));
        var avg=gray.reduce(function(a,b){return a+b;},0)/64;
        resolve(gray.map(function(v){return v>=avg?1:0;}).join(""));
      }catch(e){resolve(null);}
    };
    img.onerror=function(){resolve(null);};
    img.src=url+"?_="+(Date.now()); // evitar caché CORS
  });
}

function hammingDist(h1,h2){
  if(!h1||!h2||h1.length!==h2.length)return 64;
  var d=0;for(var i=0;i<h1.length;i++)if(h1[i]!==h2[i])d++;return d;
}

function cloudinarySmall(url){
  if(!url||url.indexOf("res.cloudinary.com")<0)return url;
  return url.replace("/upload/","/upload/w_600,h_600,c_fill,q_80/");
}
// Transformación optimizada para visión de IA: 1024px, alta calidad, sin recorte
function cloudinaryForAI(url){
  if(!url||url.indexOf("res.cloudinary.com")<0)return url;
  return url.replace("/upload/","/upload/w_1024,h_1024,c_limit,q_90,f_jpg/");
}
var _IMG_EXTS_GLOBAL=["jpg","jpeg","png","gif","webp","heic","heif","bmp","tiff"];
function isImageAttGlobal(a){
  if(a.type&&a.type.indexOf("image")>=0)return true;
  if(a.name){var ext=(a.name.split(".").pop()||"").toLowerCase();return _IMG_EXTS_GLOBAL.indexOf(ext)>=0;}
  return false;
}
// Distancia en metros entre dos coords (Haversine)
function haversineMeters(lat1,lng1,lat2,lng2){
  var R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function checkFaceIdentity(profileUrl,evidenceUrl){
  return fetch("/.netlify/functions/facematch",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({profileUrl:cloudinarySmall(profileUrl),evidenceUrl:cloudinarySmall(evidenceUrl)})
  }).then(function(r){return r.json();}).catch(function(){return{skipped:true,reason:"error_red"};});
}

async function runFaceAndDuplicateChecks(taskId,attachments){
  var t=state.tasks.find(function(x){return x.id==taskId;});
  if(!t)return{passed:true};
  var col=state.collaborators.find(function(c){
    return Array.isArray(t.assignedTo)?t.assignedTo.indexOf(c.id)>=0:c.id===t.assignedTo;
  });
  var IMG_EXTS2=["jpg","jpeg","png","gif","webp","heic","heif","bmp"];
  var imgs=attachments.filter(function(a){
    if(a.type&&a.type.indexOf("image")>=0)return true;
    if(a.name){var ext=(a.name.split(".").pop()||"").toLowerCase();return IMG_EXTS2.indexOf(ext)>=0;}
    return false;
  });
  if(!imgs.length)return{passed:true};

  var newHashes=[];
  var faceResults=[];
  for(var i=0;i<imgs.length;i++){
    // 1. DUPLICADO — siempre activo
    var h=await imgHash(imgs[i].url);
    if(h){
      var allHistory=(t.history||[]);
      for(var j=0;j<allHistory.length;j++){
        var prevHashes=allHistory[j].photoHashes||[];
        for(var k=0;k<prevHashes.length;k++){
          if(hammingDist(h,prevHashes[k])<10){
            return{passed:false,reason:"duplicate",
              msg:"⚠️ Esta imagen ya fue utilizada como soporte el "+escH(allHistory[j].date||"")+". Por favor toma una foto nueva."};
          }
        }
      }
      newHashes.push(h);
    }
    // 2. RECONOCIMIENTO FACIAL — solo si la tarea lo requiere
    var validProfileUrl=col&&col.photo&&!col.photo.startsWith("data:")&&!col.photo.startsWith("blob:");
    if(t.faceRecognition&&validProfileUrl){
      var result=await checkFaceIdentity(col.photo,imgs[i].url);
      // Umbral de coincidencia configurable por tarea (default 70%)
      var faceThr=t.faceThreshold||70;
      if(!result.skipped)result.matched=(result.confidence||0)>=faceThr;
      // confidence===0 con matched===false indica error de API (no un 0% real) → tratar como skip
      if(!result.skipped&&result.matched===false&&(result.confidence||0)>0){
        return{passed:false,reason:"face_mismatch",
          msg:"❌ El rostro en la foto "+(imgs.length>1?"#"+(i+1)+" ":"")+"no corresponde al colaborador registrado (coincidencia: "+Math.round(result.confidence)+"%, se requiere ≥"+faceThr+"%). Por favor toma una selfie válida."};
      }
      faceResults.push(result);
    }
  }
  // Construir resumen biométrico para el chat
  var bioSummary="";
  if(imgs.length>0){
    var dupLine="✅ "+imgs.length+" foto(s) verificada(s) — sin duplicados detectados.";
    var faceLine="";
    if(t.faceRecognition){
      var verified=faceResults.filter(function(r){return !r.skipped&&r.matched;});
      var skipped=faceResults.filter(function(r){return r.skipped;});
      var validProfile=col&&col.photo&&!/^data:|^blob:/.test(col.photo);
      if(verified.length>0){
        var avgConf=Math.round(verified.reduce(function(s,r){return s+(r.confidence||0);},0)/verified.length);
        faceLine="\n🙂 Reconocimiento facial: VERIFICADO — coincidencia "+avgConf+"%.";
      }else if(!col||!col.photo){
        faceLine="\n⚠️ Reconocimiento facial: el colaborador NO tiene foto de perfil registrada — no hay contra qué comparar.";
      }else if(!validProfile){
        faceLine="\n⚠️ Reconocimiento facial: la foto de perfil del colaborador no está subida correctamente (temporal/local). Vuelve a cargar su foto de perfil.";
      }else if(faceResults.length===0){
        faceLine="\n⚠️ Reconocimiento facial: no se ejecutó — no hubo imagen con rostro para comparar (¿evidencia sin rostro visible?).";
      }else if(skipped.length===faceResults.length){
        faceLine="\n⚠️ Reconocimiento facial: no se detectó rostro en la(s) foto(s) — motivo: "+(faceResults.map(function(r){return r.reason||"sin rostro";}).join("; "))+".";
      }else{
        faceLine="\n⚠️ Reconocimiento facial: resultado no concluyente — "+(faceResults.map(function(r){return r.skipped?(r.reason||"omitido"):("coincidencia "+Math.round(r.confidence||0)+"%");}).join("; "))+".";
      }
    }else{
      faceLine="\nℹ️ Reconocimiento facial: NO activado en esta tarea.";
    }
    bioSummary=dupLine+faceLine;
  }
  return{passed:true,newHashes:newHashes,bioSummary:bioSummary};
}

async function _finishSubmit(taskId,report,attachments){
  var t=state.tasks.find(function(x){return x.id==taskId;});
  if(!t)return;
  // Verificar soportes obligatorios
  var req=t.requiredEvidence||{};
  var missing=[];
  var IMG_EXTS3=["jpg","jpeg","png","gif","webp","heic","heif","bmp"];
  function isImgAtt2(a){if(a.type&&a.type.indexOf("image")>=0)return true;if(a.name){var e2=(a.name.split(".").pop()||"").toLowerCase();return IMG_EXTS3.indexOf(e2)>=0;}return false;}
  var hasPhoto=attachments.some(isImgAtt2);
  var hasDoc=attachments.some(function(a){return!isImgAtt2(a)&&!(a.type&&a.type.indexOf("video")>=0)&&!(a.name&&["mp4","mov","avi","webm"].indexOf((a.name.split(".").pop()||"").toLowerCase())>=0);});
  // Lógica OR: si hay múltiples tipos habilitados, basta con que el colaborador suba AL MENOS UNO de ellos
  var enabledTypes=[];
  if(req.photo)enabledTypes.push({label:"📷 Foto",ok:hasPhoto});
  if(req.image)enabledTypes.push({label:"🖼️ Imagen",ok:hasPhoto});
  if(req.document)enabledTypes.push({label:"📄 Documento",ok:hasDoc});
  if(enabledTypes.length>0&&!enabledTypes.some(function(e){return e.ok;})){
    // Ninguno de los tipos habilitados fue proporcionado
    toast("Adjunta al menos un soporte: "+enabledTypes.map(function(e){return e.label;}).join(" o "),"error");
    showCompletionReport(taskId);return;
  }
  if(missing.length>0){
    toast("Faltan soportes obligatorios:\n"+missing.join(", "),"error");
    showCompletionReport(taskId);return;
  }
  // Verificar duplicados y reconocimiento facial
  var hasImgs=attachments.some(isImgAtt2);
  if(hasImgs){
    toast("🔍 Verificando imágenes…");
    var checks=await runFaceAndDuplicateChecks(taskId,attachments);
    if(!checks.passed){
      showCompletionReport(taskId,checks.msg);return;
    }
    // Guardar hashes en el estado temporal para registrarlos al aprobar
    t._pendingHashes=checks.newHashes||[];
    t._biometricSummary=checks.bioSummary||"";
  }
  t.status="pendiente_validacion";
  t.pendingReport=report;
  t.pendingAttachments=attachments;
  saveLocal();render();
  toast("Enviado para validación JARVIS 🤖");
  // Capturar bioSummary ANTES del delay: onSnapshot puede reemplazar el state y perder _biometricSummary
  var capturedBioSummary=t._biometricSummary||"";
  // Esperar 2s para que el CDN de Cloudinary propague todas las imágenes antes de que Claude las descargue
  setTimeout(function(){validateTaskCompletion(taskId,report,attachments,capturedBioSummary);},2000);
}

  var allMatchedRefs=[];

    }
    if(evImageBlocks.length>0){
      msgContent.push({type:"text",text:"🟩 EVIDENCIA DEL COLABORADOR ("+evImageBlocks.length+"): lo ÚNICO que prueba cumplimiento. Valida cada criterio SOLO por lo que se ve realmente en estas imágenes. Si un elemento no aparece aquí, cumplido:false aunque la referencia lo muestre perfecto."});
      evImageBlocks.forEach(function(b){msgContent.push(b);});
    }
    msgContent.push({type:"text",text:"Valida el reporte aplicando las reglas estrictas."});
  }else msgContent="Valida el reporte.";
  fetch("/.netlify/functions/claude",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1800,system:sys,messages:[{role:"user",content:msgContent}]})
  }).then(function(r){
    var ct=r.headers.get("content-type")||"";
    if(!ct.includes("json"))return r.text().then(function(){throw new Error("Servidor no disponible ("+r.status+"). Intenta de nuevo.");});
    return r.json();
  }).then(function(d){
    t=state.tasks.find(function(x){return x.id==taskId;});
    if(!t)return;
    // Manejar errores de API (rate limit, etc.)
    if(d.error){
      t.status="en-progreso";
      var em=d.error.type==="rate_limit_error"?"⏳ Límite de uso alcanzado. Espera 1 minuto e intenta de nuevo.":"⚠️ Error del servicio: "+d.error.message;
      if(state.messages[ck])state.messages[ck].push({id:Date.now(),from:"ai",text:em,ts:Date.now()});
      delete t.pendingReport;delete t.pendingAttachments;delete t._pendingHashes;
      saveLocal();if(db)saveCloud();render();return;
    }
    var raw=(d.content&&d.content[0]&&d.content[0].text)||"";
    var result={};
    if(raw){try{var m=raw.match(/\{[\s\S]*\}/);result=m?JSON.parse(m[0]):{};}catch(e){console.warn("JSON parse error:",e,raw);}}
    if(!state.messages[ck])state.messages[ck]=[];
    // Si la IA no devolvió una respuesta válida (API error, timeout, etc.)
    if(!raw||typeof result.aprobada==="undefined"){
      t.status="en-progreso";
      state.messages[ck].push({id:Date.now(),from:"ai",text:"⚠️ El servicio de validación no respondió correctamente. Intenta reportar de nuevo en 1 minuto.",ts:Date.now()});
      delete t.pendingReport;delete t.pendingAttachments;delete t._pendingHashes;
      _aiLastTs=Date.now();
      saveLocal();if(db)saveCloud();render();return;
    }
    var approved=result.aprobada===true;
    if(approved){
      var cs=cycleStart(t);
      var alreadyDone=(t.history||[]).some(function(h){return h.ts>=cs&&h.approved;});
      if(!alreadyDone){t.history=(t.history||[]).filter(function(h){return h.ts<cs||h.approved;});}
      if(!alreadyDone){
        if(!t.history)t.history=[];
        var now2=new Date();
        var res2="green";
        if(t.endDate){var due2=taskDue(t);var diff2=now2.getTime()-due2;if(diff2>0&&diff2<=OT[t.frequency||"diaria"])res2="yellow";else if(diff2>OT[t.frequency||"diaria"])res2="red";}
        t.history.push({date:now2.toLocaleDateString("es"),ts:now2.getTime(),result:res2,approved:true,report:t.pendingReport||"",attachments:attachments,photoHashes:t._pendingHashes||[],criteriaResults:result.criteriaResults||[],datos_extraidos:result.datos_extraidos||""});
        if(t.history.length>20)t.history=t.history.slice(-20);
      }
      t.status="completada";delete t.eppIncomplete;
      var attLinks=attachments.length>0?"\n\n📎 Soportes:\n"+attachments.map(function(a){return getFileIcon(a.type,a.name)+" "+a.name;}).join("\n"):"";
      var razonOk=result.razon||result.reason||"✅ Aprobada.";
      var pctOk=typeof result.porcentaje==="number"?"📊 Cumplimiento: "+result.porcentaje+"%\n\n":"";
      var crOk=(result.criteriaResults||[]).map(function(cr){return(cr.cumplido?"✅":"❌")+" "+cr.criterio+(cr.detalle?": "+cr.detalle:"");}).join("\n");
      state.messages[ck].push({id:Date.now(),from:"ai",text:"✅ Tarea validada y aprobada.\n\n"+pctOk+razonOk+(crOk?"\n\n"+crOk:"")+attLinks,ts:Date.now(),attachments:attachments});
      if(result.datos_extraidos)state.messages[ck].push({id:Date.now()+1,from:"ai",type:"datos_extraidos",text:"📊 Datos extraídos de las imágenes:\n\n"+result.datos_extraidos,ts:Date.now()+1});
      sendNotif("boss","✅ Tarea aprobada","\""+t.title+"\""+(col?" — "+col.name:"")+" pasó la validación.");
      if(t.reportEnabled&&t.reportTemplate&&(t.reportTemplate.columns||[]).length)triggerReportExtraction(t,col,attachments,ck);
    }else{
      // Flujo EPP: si cumple >60% pero faltan EPP, pedir las que faltan (una por una) o permitir seguir sin EPP con reporte de incumplimiento
      var pctVal=typeof result.porcentaje==="number"?result.porcentaje:0;
      var isEpp=/\bepp\b|protecci[oó]n personal|equipo de proteccion/i.test((t.title||"")+" "+(t.criteria||"")+" "+(t.notes||""));
      var missingEpp=(result.criteriaResults||[]).filter(function(cr){return cr.cumplido===false;}).map(function(cr){return cr.criterio;});
      if(isEpp&&pctVal>60&&missingEpp.length){
        if(!t.history)t.history=[];
        t.history.push({date:new Date().toLocaleDateString("es"),ts:Date.now(),result:"red",approved:false,report:t.pendingReport||"",criteriaResults:result.criteriaResults||[]});
        if(t.history.length>20)t.history=t.history.slice(-20);
        t.status="en-progreso";
        t.eppIncomplete={pct:pctVal,missing:missingEpp};
        var crEpp=(result.criteriaResults||[]).map(function(cr){return(cr.cumplido?"✅":"❌")+" "+cr.criterio+(cr.detalle?": "+cr.detalle:"");}).join("\n");
        state.messages[ck].push({id:Date.now(),from:"ai",text:"🦺 EPP incompleto — "+pctVal+"% cumplido.\n\n"+crEpp+"\n\n📷 Sube evidencia SOLO de las EPP que faltan ("+missingEpp.join(", ")+") con \"📷 Completar EPP\", una por una hasta completar.\n\n⚠️ Si NO cuentas con ellas, usa \"Seguir sin EPP\": se registrará el trabajo y se enviará un reporte de incumplimiento de EPP a tu jefe y al validador.",ts:Date.now()});
        sendNotif("boss","🦺 EPP incompleto","\""+t.title+"\""+(col?" — "+col.name:"")+": "+pctVal+"%, faltan "+missingEpp.join(", "));
        if(col)sendNotif("collab_"+col.id,"🦺 EPP incompleto","Completa las EPP que faltan o marca 'Seguir sin EPP'.");
        delete t.pendingReport;delete t.pendingAttachments;delete t._pendingHashes;
        _aiLastTs=Date.now();saveLocal();if(db)saveCloud();render();return;
      }
      if(!t.history)t.history=[];
      t.history.push({date:new Date().toLocaleDateString("es"),ts:Date.now(),result:"red",approved:false,report:t.pendingReport||"",criteriaResults:result.criteriaResults||[],datos_extraidos:result.datos_extraidos||""});
      if(t.history.length>20)t.history=t.history.slice(-20);
      t.status="en-progreso";
      var razonNok=result.razon||result.reason||"Criterios no cumplidos.";
      var pctNok=typeof result.porcentaje==="number"?"📊 Cumplimiento: "+result.porcentaje+"%\n\n":"";
      var crNok=(result.criteriaResults||[]).map(function(cr){return(cr.cumplido?"✅":"❌")+" "+cr.criterio+(cr.detalle?": "+cr.detalle:"");}).join("\n");
      var pasosNok=(result.pasos||[]).filter(function(p){return p;}).map(function(p){return"• "+p;}).join("\n");
      state.messages[ck].push({id:Date.now(),from:"ai",text:"❌ Validación no aprobada.\n\n"+pctNok+razonNok+(crNok?"\n\n"+crNok:"")+(pasosNok?"\n\n🔧 Para aprobar:\n"+pasosNok:"")+"\n\n🔄 Corrige los puntos indicados y vuelve a reportar.",ts:Date.now()});
      sendNotif("boss","⚠️ Validación rechazada","\""+t.title+"\""+(col?" — "+col.name:"")+" no cumple los criterios.");
      if(col)sendNotif("collab_"+col.id,"❌ Reporte rechazado","\""+t.title+"\": "+razonNok.slice(0,80));
      // Seguimiento programado (máx 2 veces para no consumir tokens indefinidamente)
      if(!(t._followUpCount>=2)){t._followUpCount=(t._followUpCount||0)+1;setTimeout(function(){aiFollowUp(taskId);},OT[t.frequency||"diaria"]/2);}
    }
    delete t.pendingReport;delete t.pendingAttachments;delete t._pendingHashes;
    _aiLastTs=Date.now();
    saveLocal();if(db)saveCloud();render();
  }).catch(function(e){
    t=state.tasks.find(function(x){return x.id==taskId;})||t;
    t.status="en-progreso";
    if(!state.messages[ck])state.messages[ck]=[];
    state.messages[ck].push({id:Date.now(),from:"ai",text:"⚠️ Error al validar: "+(e&&e.message||"Sin conexión")+". Intenta reportar de nuevo.",ts:Date.now()});
    delete t.pendingReport;delete t.pendingAttachments;delete t._pendingHashes;
    _aiLastTs=Date.now();
    saveLocal();if(db)saveCloud();render();
  });
}

function aiFollowUp(taskId){
  var t=state.tasks.find(function(x){return x.id==taskId;});
  if(!t||t.status==="completada")return;
  var col=state.collaborators.find(function(c){return Array.isArray(t.assignedTo)?t.assignedTo.indexOf(c.id)>=0:c.id===t.assignedTo;});
  var ck=t.isGroup&&t.groupKey?t.groupKey:(col?collabCK(col.id):null);
  if(!ck)return;
  var ov=!t.indefinite&&t.endDate&&taskDue(t)<Date.now();
  if(ov){
    // Incumplimiento inevitable → notificar a Manuel
    state.messages[ck].push({id:Date.now(),from:"system",flag:true,ts:Date.now(),
      text:"🚩 La tarea \""+t.title+"\" presenta un incumplimiento inevitable. Se ha notificado a Manuel para que dicte medidas correctivas o de sanción."});
    sendNotif("boss","🚩 Incumplimiento inevitable","\""+t.title+"\""+(col?" — "+col.name:"")+" requiere tu decisión sobre medidas correctivas.");
    // Pedir a Manuel que dicte medidas en el chat
    var sys3="Eres JARVIS, asistente de AgendaTeam. La tarea \""+t.title+"\" asignada a "+(col?col.name:"el colaborador")+" no se pudo completar a tiempo y no cumple los criterios de validación. Notifica a Manuel que debe dictar medidas correctivas o de sanción, y pídele que las especifique en este chat. Sé directo y profesional. Máximo 3 oraciones.";
    aiNotify(ck,sys3,"Incumplimiento inevitable — solicitar medidas a Manuel.");
  }else{
    var sys4="Eres JARVIS, asistente de seguimiento de AgendaTeam. La tarea \""+t.title+"\" de "+(col?col.name:"el colaborador")+" fue rechazada en validación y aún no está completa. Pregunta por el avance, recuérdales los criterios pendientes y presiona para que se tome acción inmediata. Máximo 3 oraciones. En español.";
    aiNotify(ck,sys4,"Seguimiento de tarea rechazada.");
    if(col)sendNotif("collab_"+col.id,"🔔 Seguimiento pendiente","\""+t.title+"\": aún requiere tu atención.");
    setTimeout(function(){aiFollowUp(taskId);},OT[t.frequency||"diaria"]/2);
  }
  saveLocal();
}

    saveLocal();render();return;
  }
  state.messages[ck]&&state.messages[ck].push({id:Date.now(),from:"system",type:"report_extracting",ts:Date.now(),
    text:"📊 Extrayendo datos del reporte de "+imgAtts.length+" soporte(s)…"});
  saveLocal();render();
  var rows=[];
  var pending=imgAtts.length;
  var templateBlock=task.reportTemplate.type==="image"&&task.reportTemplate.url?
    [{type:"image",source:{type:"url",url:cloudinaryForAI(task.reportTemplate.url)}},
     {type:"text",text:"La imagen anterior es la PLANTILLA de la tabla (solo referencia de columnas)."}]:[];
  imgAtts.forEach(function(att,idx){
    var content=templateBlock.concat([
      {type:"image",source:{type:"url",url:cloudinaryForAI(att.url)}},
      {type:"text",text:"Extrae de este soporte los valores para las siguientes columnas: "+
        columns.map(function(c,i){return(i+1)+". "+c;}).join("; ")+
        ". Si un valor no está visible o no aplica, usa null. Responde SOLO JSON sin texto extra: "+
        "{\"extracted\":{\""+columns.join("\":\"valor\",\"")+"\": \"valor\"},\"missing\":[\"columna faltante si la hay\"]}"}
    ]);
    fetch("/.netlify/functions/claude",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:700,
        messages:[{role:"user",content:content}]})
    }).then(function(r){return r.json();}).then(function(d){
      var raw=(d.content&&d.content[0]&&d.content[0].text)||"";
      var result={};try{var m=raw.match(/\{[\s\S]*\}/);result=m?JSON.parse(m[0]):{};} catch(e){}
      // Filter out false-positive "missing" entries (where value exists)
      var extracted=result.extracted||{};
      var missing=(result.missing||[]).filter(function(c){return extracted[c]==null;});
      rows.push({attName:att.name,attUrl:att.url,
        collabId:col?col.id:null,collabName:col?col.name:"Equipo",
        date:new Date().toLocaleDateString("es"),ts:Date.now()+idx,
        extracted:extracted,missing:missing});
      if(--pending===0)onAllExtracted(task,rows,ck);
    }).catch(function(){
      rows.push({attName:att.name,attUrl:att.url,collabId:col?col.id:null,collabName:col?col.name:"Equipo",
        date:new Date().toLocaleDateString("es"),ts:Date.now()+idx,extracted:{},missing:columns.slice(),error:true});
      if(--pending===0)onAllExtracted(task,rows,ck);
    });
  });
}
function onAllExtracted(task,rows,ck){
  var hasMissing=rows.some(function(r){return r.missing&&r.missing.length;});
  if(hasMissing)showReportIncompleteDialog(task,rows,ck);
  else appendReportRows(task,rows,ck,false);
}
function showReportIncompleteDialog(task,rows,ck){
  _pendingReportRows=rows;_pendingReportTask=task;_pendingReportCk=ck;
  var allMissing=[].concat.apply([],rows.map(function(r){return r.missing||[];}));
  var unique=allMissing.filter(function(v,i,a){return a.indexOf(v)===i;});
  var box=document.getElementById("report-dialog-box");
  var overlay=document.getElementById("report-dialog-overlay");
  if(!box||!overlay)return;
  var incompleteCount=rows.filter(function(r){return r.missing&&r.missing.length;}).length;
  box.innerHTML='<div style="font-size:36px;margin-bottom:10px;">⚠️</div>'+
    '<p style="font-weight:800;font-size:16px;margin-bottom:6px;">Datos incompletos en el reporte</p>'+
    '<p style="font-size:13px;color:#999;margin-bottom:6px;">'+incompleteCount+' soporte(s) con datos no visibles:</p>'+
    '<p style="font-size:13px;font-weight:700;color:#e74c3c;margin-bottom:16px;">'+escH(unique.join(", "))+'</p>'+
    '<div style="display:flex;flex-direction:column;gap:10px;">'+
    '<button onclick="reportIncompleteApprove()" class="btn btn-blue btn-block">✅ Autorizar reporte incompleto</button>'+
    '<button onclick="reportIncompleteReject()" class="btn btn-gray btn-block">✕ No autorizar</button>'+
    '</div>';
  overlay.style.display="flex";
}
function reportIncompleteApprove(){
  document.getElementById("report-dialog-overlay").style.display="none";
  appendReportRows(_pendingReportTask,_pendingReportRows,_pendingReportCk,true);
  _pendingReportRows=_pendingReportTask=_pendingReportCk=null;
}
function reportIncompleteReject(){
  document.getElementById("report-dialog-overlay").style.display="none";
  var ck=_pendingReportCk;
  if(ck&&state.messages[ck]){
    var missing=[].concat.apply([],(_pendingReportRows||[]).map(function(r){return r.missing||[];}));
    var unique=missing.filter(function(v,i,a){return a.indexOf(v)===i;});
    state.messages[ck].push({id:Date.now(),from:"ai",type:"report_incomplete",ts:Date.now(),
      text:"⚠️ Reporte no autorizado. Datos no visibles en los soportes: "+unique.join(", ")+". El colaborador debe adjuntar soportes donde esta información sea claramente legible."});
    saveLocal();render();
  }
  _pendingReportRows=_pendingReportTask=_pendingReportCk=null;
}
function appendReportRows(task,rows,ck,approvedIncomplete){
  if(!task.reportData)task.reportData=[];
  rows.forEach(function(r){task.reportData.push(Object.assign({},r,{approvedIncomplete:approvedIncomplete}));});
  if(task.reportData.length>500)task.reportData=task.reportData.slice(-500);
  var n=rows.length;
  var incomplete=rows.filter(function(r){return r.missing&&r.missing.length;}).length;
  if(ck&&state.messages[ck]){
    var cols=(task.reportTemplate&&task.reportTemplate.columns)||[];
    var rowSummary=rows.map(function(r){
      return"• "+escH(r.attName)+": "+cols.map(function(c){
        var v=(r.extracted||{})[c];return c+": "+(v!=null?v:"—");}).join(" | ");
    }).join("\n");
    state.messages[ck].push({id:Date.now(),from:"ai",type:"report_done",ts:Date.now(),
      text:"📊 Reporte actualizado — "+n+" fila(s) agregada(s)"+(incomplete?" ("+incomplete+" incompleta(s)"+( approvedIncomplete?", autorizado":"")+")":"")+".\n"+rowSummary});
  }
  saveLocal();if(db)saveCloud();render();
}
function exportTaskReport(taskId){
  var t=state.tasks.find(function(x){return x.id==taskId;});
  if(!t||!t.reportData||!t.reportData.length){toast("Sin datos de reporte aún","error");return;}
  var cols=(t.reportTemplate&&t.reportTemplate.columns)||[];
  var sheetRows=t.reportData.map(function(r){
    var obj={"Colaborador":r.collabName||"","Fecha":r.date||"","Soporte":r.attName||""};
    cols.forEach(function(c){obj[c]=(r.extracted||{})[c]!=null?String((r.extracted||{})[c]):"";});
    obj["Datos incompletos"]=(r.missing&&r.missing.length)?r.missing.join(", "):"";
    obj["Autorizado incompleto"]=r.approvedIncomplete?"Sí":"No";
    return obj;
  });
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sheetRows),(t.title||"Reporte").slice(0,31));
  var fecha=new Date().toLocaleDateString("es").replace(/\//g,"-");
  var safeName=(t.title||"Reporte").slice(0,20).replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s]/g,"_");
  XLSX.writeFile(wb,"Reporte_"+safeName+"_"+fecha+".xlsx");
  toast("Reporte exportado ✓");
}

function inPeriod(dateStr){
  if(repPeriod==="todo"||!dateStr)return true;
  var tk=todayKey();
  if(repPeriod==="hoy")return dateStr===tk;
  var d=new Date(dateStr+"T00:00").getTime(),diff=(Date.now()-d)/86400000;
  if(repPeriod==="semana")return diff<=7;
  if(repPeriod==="mes")return diff<=31;
  return true;
}
function allActivityNames(){var m={};(state.activities||[]).forEach(function(a){if(a.name&&actVisible(a)){var cn=canonName(a.name);m[normActName(cn)]=cn;}});return Object.keys(m).map(function(k){return m[k];}).sort();}

function barRow(name,ms,total,n,color){

  return'<div style="padding:9px 0;border-bottom:1px solid #f0f2f7;"><div style="display:flex;justify-content:space-between;gap:8px;"><span style="font-weight:700;">'+escH(name)+'</span><span style="font-weight:800;white-space:nowrap;color:'+color+';">'+fmtDur(ms)+'</span></div>'+
    '<div style="background:#e8eaf0;border-radius:99px;height:6px;margin-top:6px;overflow:hidden;"><div style="background:'+color+';height:6px;width:'+pct+'%;"></div></div>'+
    '<div style="font-size:11px;color:#999;margin-top:2px;">'+n+' sesión(es) · '+pct+'%</div></div>';

function exportExcel(){
  if(typeof XLSX==="undefined"){toast("XLSX no disponible","error");return;}
  var now=Date.now();
  var tasks=state.tasks;
  var collabs=state.collaborators;

  function collabName(assignedTo){
    if(Array.isArray(assignedTo))return assignedTo.map(function(id){var c=collabs.find(function(c){return c.id===id;});return c?c.name:"?";}).join(", ");
    var c=collabs.find(function(c){return c.id===assignedTo;});return c?c.name:"Sin asignar";
  }

  // Hoja 1: Todas las tareas
  var tasksRows=tasks.map(function(t){
    var ov=t.status!=="completada"&&t.status!=="cancelada"&&!t.indefinite&&t.endDate&&taskDue(t)<now;
    return{
      "Título":t.title||"",
      "Asignado a":collabName(t.assignedTo),
      "Frecuencia":(FC[t.frequency]||FC.diaria).l,
      "Prioridad":(PC[t.priority]||PC.media).l,
      "Estado":(SC[t.status]||SC.pendiente).l,
      "Vencida":ov?"Sí":"No",
      "Fecha límite":t.indefinite?"Sin fecha":(t.endDate||""),
      "Hora límite":t.endTime||"",
      "Indefinida":t.indefinite?"Sí":"No",
      "Veces completada":(t.history||[]).length,
      "Notas":t.notes||""
    };
  });

  // Hoja 2: Resumen por colaborador
  var summaryRows=collabs.map(function(c){
    var ct=tasks.filter(function(t){return taskBelongsTo(t,c.id);});
    var cDone=ct.filter(function(t){return t.status==="completada";}).length;
    var cPend=ct.filter(function(t){return t.status==="pendiente";}).length;
    var cProg=ct.filter(function(t){return t.status==="en-progreso";}).length;
    var cVenc=ct.filter(function(t){return t.status!=="completada"&&t.status!=="cancelada"&&!t.indefinite&&t.endDate&&taskDue(t)<now;}).length;
    return{
      "Colaborador":c.name,
      "Total tareas":ct.length,
      "Completadas":cDone,
      "Pendientes":cPend,
      "En progreso":cProg,
      "Vencidas":cVenc,
      "% Cumplimiento":ct.length?Math.round(cDone/ct.length*100)+"%":"0%"
    };
  });

  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tasksRows),"Tareas");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summaryRows),"Resumen equipo");
  var fecha=new Date().toLocaleDateString("es").replace(/\//g,"-");
  XLSX.writeFile(wb,"AgendaTeam_Reporte_"+fecha+".xlsx");
  toast("Reporte exportado");
}

function renderRefPreview(){
  var el=document.getElementById("ref-preview");if(!el)return;
  var html=_existingRefImgs.map(function(img,i){
    return'<div style="position:relative;"><img src="'+img.url+'" style="width:72px;height:72px;object-fit:cover;border-radius:8px;">'+

function saveRef(){
  var name=(document.getElementById("rf-name")||{}).value||"";
  var cat=(document.getElementById("rf-cat")||{}).value||"";
  var desc=(document.getElementById("rf-desc")||{}).value||"";
  name=name.trim();
  if(!name){toast("El nombre es obligatorio","error");return;}
  var prog=document.getElementById("ref-upload-progress");
  function finish(newUrls){
    var allImgs=_existingRefImgs.concat(newUrls);
    if(_editingRefId){
      var r=(state.references||[]).find(function(x){return x.id==_editingRefId;});
      if(r){Object.assign(r,{name:name,category:cat,description:desc,imageUrls:allImgs,folderId:_currentFolderId||null});}
    }else{
      if(!state.references)state.references=[];
      state.references.push({id:Date.now(),name:name,category:cat,description:desc,imageUrls:allImgs,folderId:_currentFolderId||null});
    }
    saveLocal();render();closeSheet();toast("Artículo guardado ✓");
  }
  if(_refFiles.length>0){
    if(prog)prog.style.display="block";
    var done=[],total=_refFiles.length;
    _refFiles.forEach(function(f,idx){
      var fd=new FormData();
      fd.append("file",f);fd.append("upload_preset",CLOUDINARY_PRESET);fd.append("folder","agendateam_refs");
      var xhr=new XMLHttpRequest();
      xhr.open("POST","https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD+"/image/upload");
      xhr.onload=function(){
        try{var r2=JSON.parse(xhr.responseText);done.push({url:r2.secure_url,name:f.name,type:f.type});}catch(e){done.push({url:"",name:f.name,type:f.type});}
        if(done.length===total)finish(done);
      };
      xhr.onerror=function(){done.push({url:"",name:f.name,type:f.type});if(done.length===total)finish(done);};
      xhr.send(fd);
    });
  }else{finish([]);}
}

function delRef(id){
  if(!confirm("¿Eliminar este artículo de referencia?"))return;
  state.references=(state.references||[]).filter(function(r){return r.id!=id;});
  saveLocal();render();toast("Artículo eliminado","error");
}

function tfSetReportTemplate(file){
  if(!file)return;
  var prev=document.getElementById("tf-rep-preview");
  if(prev)prev.innerHTML='<div style="color:#aaa;">⏳ Procesando plantilla…</div>';
  var ext=(file.name.split(".").pop()||"").toLowerCase();
  var isExcel=["xlsx","xls","csv"].indexOf(ext)>=0;
  if(isExcel){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(e.target.result,{type:"array"});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1});
        var headers=(rows[0]||[]).filter(Boolean).map(String);
        _tfReportTemplateData={name:file.name,type:"excel",columns:headers};
        if(prev)prev.innerHTML='<div style="color:#27ae60;font-weight:700;">✓ '+escH(file.name)+'</div>'+
          (headers.length?'<div style="font-size:12px;margin-top:4px;color:#555;">Columnas: <b>'+escH(headers.join(", "))+'</b></div>':
          '<div style="color:#e74c3c;font-size:12px;">No se encontraron columnas en la primera fila.</div>');
      }catch(e2){
        if(prev)prev.innerHTML='<div style="color:#e74c3c;">Error al leer Excel: '+escH(e2.message)+'</div>';
      }
    };
    reader.readAsArrayBuffer(file);
  }else{
    if(prev)prev.innerHTML='<div style="color:#aaa;">⏳ Subiendo imagen…</div>';
    uploadEvidence("report_templates",[file],[null],null,function(urls){
      var url=urls[0]&&urls[0].url;
      if(!url){if(prev)prev.innerHTML='<div style="color:#e74c3c;">Error al subir imagen.</div>';return;}
      if(prev)prev.innerHTML='<div style="color:#aaa;">🤖 Detectando columnas de la tabla…</div>';
      fetch("/.netlify/functions/claude",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:400,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"url",url:cloudinaryForAI(url)}},
            {type:"text",text:'Esta es una plantilla de tabla. Extrae los nombres exactos de los encabezados de columna. Responde SOLO JSON: {"columns":["col1","col2",...]}'}
          ]}]})
      }).then(function(r){return r.json();}).then(function(d){
        var raw=(d.content&&d.content[0]&&d.content[0].text)||"";
        var result={};try{var m=raw.match(/\{[\s\S]*\}/);result=m?JSON.parse(m[0]):{};} catch(e){}
        var cols=result.columns||[];
        _tfReportTemplateData={name:file.name,type:"image",url:url,columns:cols};
        if(prev)prev.innerHTML='<div style="color:#27ae60;font-weight:700;">✓ '+escH(file.name)+'</div>'+
          (cols.length?'<div style="font-size:12px;margin-top:4px;color:#555;">Columnas: <b>'+escH(cols.join(", "))+'</b></div>':
          '<div style="color:#e74c3c;font-size:12px;">No se detectaron columnas. Verifica que la imagen muestre claramente los encabezados.</div>');
      }).catch(function(){
        _tfReportTemplateData={name:file.name,type:"image",url:url,columns:[]};
        if(prev)prev.innerHTML='<div style="color:#e74c3c;">No se pudieron detectar columnas. Ingresa las columnas manualmente.</div>';
      });
    },function(err){
      if(prev)prev.innerHTML='<div style="color:#e74c3c;">Error al subir: '+escH(err)+'</div>';
    });
  }
}

function confirmAssignTemplate(templateId){
  var tmpl=(state.taskTemplates||[]).find(function(x){return x.id==templateId;});
  if(!tmpl){toast("Plantilla no encontrada","error");return;}
  var members=getSelectedMembers();
  if(!members.length){toast("Selecciona al menos un colaborador","error");return;}
  // Leer ubicación si la plantilla la requiere
  var assignedLocationRef=tmpl.locationRef||null;
  if(tmpl.validateProximity){
    var selLocId=(document.getElementById("assign-loc-select")||{}).value||"";
    var selLoc=(state.locations||[]).find(function(l){return String(l.id)===String(selLocId);});
    if(!selLoc){toast("Selecciona una ubicación de referencia","error");return;}
    var taskRadius=parseInt((document.getElementById("assign-radius")||{}).value)||selLoc.radius||200;
    assignedLocationRef={locationId:selLoc.id,name:selLoc.name,type:selLoc.type,lat:selLoc.lat,lng:selLoc.lng,radius:selLoc.radius,taskRadius:taskRadius};
  }
  var isGroup=members.length>1&&_tfMode==="grupal";
  var today=new Date().toISOString().split("T")[0];
  if(isGroup){
    var taskId=Date.now();var groupKey="group_"+taskId;
    var cols=members.map(function(id){return state.collaborators.find(function(c){return c.id===id;});}).filter(Boolean);
    var names=cols.map(function(c){return c.name.split(" ")[0];}).join(", ");
    var nt=Object.assign({},tmpl,{id:taskId,history:[],assignedTo:members,isGroup:true,groupKey:groupKey,status:"pendiente",startDate:today,locationRef:assignedLocationRef});
    state.tasks.push(nt);
    if(!state.messages[groupKey])state.messages[groupKey]=[];
    state.messages[groupKey].push({id:taskId+1,from:"system",type:"task_assigned",ts:Date.now(),
      text:"👥 Tarea grupal asignada:\n\n*\""+tmpl.title+"\"*\nFrecuencia: "+FC[tmpl.frequency||"diaria"].l+"\nPrioridad: "+PC[tmpl.priority||"media"].l+(tmpl.notes?"\nNotas: "+tmpl.notes:"")+"\n\nParticipantes: "+names});
    members.forEach(function(id){sendNotif("collab_"+id,"👥 Nueva tarea grupal","\""+tmpl.title+"\" — con "+names);});
    toast("Tarea grupal asignada ✓");
  }else{
    members.forEach(function(assignedTo,i){
      var col=state.collaborators.find(function(c){return c.id===assignedTo;});
      var nt=Object.assign({},tmpl,{id:Date.now()+i,history:[],assignedTo:assignedTo,isGroup:false,status:"pendiente",startDate:today,locationRef:assignedLocationRef});
      delete nt.groupKey;
      state.tasks.push(nt);
      if(col){
        var ck=collabCK(assignedTo);
        if(!state.messages[ck])state.messages[ck]=[];
        state.messages[ck].push({id:Date.now()+i+0.5,from:"system",type:"task_assigned",ts:Date.now(),
          text:"📋 Hola "+col.name.split(" ")[0]+", se te asignó la tarea:\n\n*\""+tmpl.title+"\"*\nFrecuencia: "+FC[tmpl.frequency||"diaria"].l+"\nPrioridad: "+PC[tmpl.priority||"media"].l+(tmpl.notes?"\nNotas: "+tmpl.notes:"")});
        sendNotif("collab_"+assignedTo,"📋 Tarea asignada","\""+tmpl.title+"\" — "+FC[tmpl.frequency||"diaria"].l);
      }
    });
    toast(members.length>1?members.length+" tareas asignadas ✓":"Tarea asignada ✓");
  }
  saveLocal();if(db)saveCloud();closeSheet();render();
}

function handlePhoto(input){
  var f=input.files[0];if(!f)return;
  var p=document.getElementById("photo-preview");
  var btn=document.querySelector(".sheet-body .btn-dark");
  if(p)p.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;">⏳</div>';
  if(btn){btn.disabled=true;btn.textContent="Subiendo foto…";}
  var fd=new FormData();
  fd.append("file",f);fd.append("upload_preset",CLOUDINARY_PRESET);fd.append("folder","agendateam_avatars");
  var xhr=new XMLHttpRequest();
  xhr.open("POST","https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD+"/image/upload");
  xhr.onload=function(){
    try{
      var r=JSON.parse(xhr.responseText);
      if(r.secure_url){
        tempPhoto=r.secure_url;
        if(p)p.innerHTML='<img src="'+tempPhoto+'">';
      }else{
        toast("Error al subir foto: "+(r.error&&r.error.message||"respuesta inválida"),"error");
        if(p)p.innerHTML='<span>👤</span>';
      }
    }catch(e){toast("Error al subir foto","error");if(p)p.innerHTML='<span>👤</span>';}
    if(btn){btn.disabled=false;btn.textContent="Guardar";}
  };
  xhr.onerror=function(){
    toast("Error de red al subir foto","error");
    if(p)p.innerHTML='<span>👤</span>';
    if(btn){btn.disabled=false;btn.textContent="Guardar";}
  };
  xhr.send(fd);
}

function openCriteriaReport(){
  var tasks=state.tasks.filter(function(t){return t.criteria&&t.criteria.trim()&&t.history&&t.history.some(function(h){return h.criteriaResults&&h.criteriaResults.length;});});
  if(!tasks.length){toast("No hay validaciones con datos estructurados aún. Los reportes se generan a partir de las próximas validaciones.","error");return;}
  var today=new Date().toLocaleDateString("es");
  var dates=[...new Set(state.tasks.flatMap(function(t){return(t.history||[]).filter(function(h){return h.criteriaResults&&h.criteriaResults.length;}).map(function(h){return h.date;});}).filter(Boolean))].sort().reverse();
  if(!dates.length){toast("No hay datos de reportes aún","error");return;}
  var dateOpts=dates.map(function(d){return'<option value="'+escH(d)+'"'+(d===today?' selected':'')+'>'+escH(d)+'</option>';}).join("");
  var taskOpts=tasks.map(function(t){return'<option value="'+t.id+'">'+escH(t.title)+'</option>';}).join("");
  showSheet("📊 Reporte por Criterios",
    '<div class="field"><label>Fecha</label><select id="rep-date" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid #e5e7ef;font-size:14px;outline:none;background:#fff;">'+dateOpts+'</select></div>'+
    '<div class="field"><label>Tarea</label><select id="rep-task" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid #e5e7ef;font-size:14px;outline:none;background:#fff;">'+taskOpts+'</select></div>'+
    '<button class="btn btn-dark btn-block" style="margin-top:8px;" onclick="generateCriteriaReport()">📊 Generar reporte</button>'+
    '<div id="rep-result" style="margin-top:16px;"></div>');
}

function generateCriteriaReport(){
  var date=(document.getElementById("rep-date")||{}).value||"";
  var taskId=(document.getElementById("rep-task")||{}).value||"";
  var task=state.tasks.find(function(t){return String(t.id)===String(taskId);});
  if(!task||!date){toast("Selecciona fecha y tarea","error");return;}

  // Recolectar todos los colaboradores asignados a esta tarea (o grupo)
  var collabs=[];
  if(task.isGroup&&Array.isArray(task.assignedTo)){
    collabs=task.assignedTo.map(function(id){return state.collaborators.find(function(c){return c.id===id;});}).filter(Boolean);
  } else {
    // Buscar todas las instancias de tareas con el mismo título en esa fecha
    var sameTasks=state.tasks.filter(function(t){return t.title===task.title&&t.criteria===task.criteria;});
    sameTasks.forEach(function(t){
      var col=state.collaborators.find(function(c){return c.id===t.assignedTo||c.id===String(t.assignedTo);});
      if(col&&!collabs.find(function(x){return x.id===col.id;}))collabs.push(col);
    });
  }

  // Obtener criterios de la tarea
  var criteriaLines=task.criteria.split(/\n/).filter(function(s){return s.trim();});
  if(criteriaLines.length<=1)criteriaLines=task.criteria.split(/\./).filter(function(s){return s.trim();});
  criteriaLines=criteriaLines.map(function(s){return s.replace(/^\d+[\.\-\)]\s*/,"").trim();}).filter(Boolean);

  // Para cada colaborador, obtener el historial del día — priorizar aprobado, sino último
  function getBestEntry(t,d){
    var dayEntries=(t.history||[]).filter(function(h){return h.date===d&&h.criteriaResults&&h.criteriaResults.length;});
    if(!dayEntries.length)return null;
    var approved=dayEntries.filter(function(h){return h.approved;});
    if(approved.length)return approved[approved.length-1]; // último aprobado del ciclo
    return dayEntries[dayEntries.length-1]; // último intento si ninguno aprobado
  }

  // Construir tabla
  var theadCols=criteriaLines.map(function(c,i){return'<th style="min-width:90px;padding:8px 6px;font-size:11px;font-weight:700;background:#1a1d2e;color:#fff;text-align:center;border:1px solid #333;max-width:120px;white-space:normal;line-height:1.3;">'+(i+1)+'. '+escH(c.length>40?c.slice(0,40)+'…':c)+'</th>';}).join("");
  var rows="";
  var allTasks=task.isGroup?[task]:state.tasks.filter(function(t){return t.title===task.title&&t.criteria===task.criteria;});

  collabs.forEach(function(col){
    var colTask=task.isGroup?task:allTasks.find(function(t){return t.assignedTo===col.id||String(t.assignedTo)===String(col.id);});
    if(!colTask)return;
    var entry=getBestEntry(colTask,date);
    var statusBadge=entry?(entry.approved?'<span style="color:#27ae60;font-weight:700;font-size:10px;">✅ APROBADO</span>':'<span style="color:#e74c3c;font-weight:700;font-size:10px;">❌ NO APROBADO</span>'):'<span style="color:#bbb;font-size:10px;">Sin reporte</span>';
    var cols=criteriaLines.map(function(c,i){
      if(!entry)return'<td style="text-align:center;background:#f8f8f8;border:1px solid #eee;padding:6px;">—</td>';
      var cr=entry.criteriaResults&&entry.criteriaResults[i];
      var cumplido=cr?cr.cumplido:null;
      if(cumplido===true)return'<td style="text-align:center;background:#f0fff4;border:1px solid #ddd;padding:6px;font-size:16px;">✓</td>';
      if(cumplido===false)return'<td style="text-align:center;background:#fff0f0;border:1px solid #ddd;padding:6px;font-size:16px;font-weight:900;color:#e74c3c;">✗</td>';
      return'<td style="text-align:center;background:#f8f8f8;border:1px solid #eee;padding:6px;">—</td>';
    }).join("");
    rows+='<tr><td style="padding:8px 10px;font-weight:700;font-size:12px;white-space:nowrap;border:1px solid #eee;background:#fafafa;">'+escH(col.name)+'<br>'+statusBadge+'</td>'+cols+'</tr>';
  });

  if(!rows){document.getElementById("rep-result").innerHTML='<div style="text-align:center;color:#bbb;padding:20px;">Sin datos para esta fecha y tarea.</div>';return;}

  var html='<div style="font-weight:800;font-size:14px;margin-bottom:10px;">📊 '+escH(task.title)+' — '+escH(date)+'</div>'+
    '<div style="overflow-x:auto;border-radius:10px;border:1px solid #eee;">'+
    '<table style="width:100%;border-collapse:collapse;font-size:12px;">'+
    '<thead><tr><th style="padding:8px 10px;background:#1a1d2e;color:#fff;text-align:left;border:1px solid #333;white-space:nowrap;">Colaborador</th>'+theadCols+'</tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
  document.getElementById("rep-result").innerHTML=html;
}

function xlStep1(){
  return'<div style="background:#f0f7ff;border:1.5px solid #d0e8ff;border-radius:14px;padding:16px;margin-bottom:20px;">'+

}
function handleXL(input){
  var f=input.files[0];if(!f)return;
  var fr=new FileReader();
  fr.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var data=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      var start=(data[0]&&typeof data[0][0]==="string"&&data[0][0].toLowerCase().includes("nombre"))?1:0;
      xlRows=data.slice(start).filter(function(r){return r[0]||r[1];}).map(function(r,i){
        return{id:i,name:String(r[0]||"").trim(),role:String(r[1]||"").trim(),phone:String(r[2]||"").trim(),email:String(r[3]||"").trim(),photo:"",color:CL[i%CL.length],
          pin:(Math.floor(100000+Math.random()*900000)).toString()};
      }).filter(function(r){return r.name;});
      updateSheetBody(xlStep2());
    }catch(err){alert("Error al leer el archivo.");}
  };
  fr.readAsArrayBuffer(f);
}
function xlStep2(){
  var rows=xlRows.map(function(r,i){

function sendMsg(){
  if(aiLoading)return;
  var _now=Date.now();if(_now-_aiLastTs<8000){toast("⏳ Espera un momento antes de enviar otro mensaje…","error");return;}
  var inp=document.getElementById("chat-in");

  var isBoss=currentUser&&currentUser.type==="boss";
  var text=inp.value.trim();inp.value="";
  var isGroupChat=currentChatKey&&currentChatKey.indexOf("group_")===0;
  var isPrivate=currentChatKey==="boss_private";

  // ── Chat privado Manuel + IA ──
  if(isPrivate){
    var pvck="boss_private";
    if(!state.messages[pvck])state.messages[pvck]=[];
    state.messages[pvck].push({id:Date.now(),from:"boss",text:text,ts:Date.now()});
    saveLocal();renderChat();
    aiLoading=true;_aiLastTs=Date.now();
    var pvToday=new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
    var pvAgo30=Date.now()-30*24*3600000;
    // Analítica completa de TODO el equipo
    var pvTeamData=state.collaborators.map(function(c){
      var ct3=state.tasks.filter(function(t){return taskBelongsTo(t,c.id);});
      var comp3=ct3.filter(function(t){return t.status==="completada";}).length;
      var over3=ct3.filter(function(t){return!t.indefinite&&t.endDate&&taskDue(t)<Date.now()&&t.status!=="completada";}).length;
      var indef3=ct3.filter(function(t){return t.indefinite;}).map(function(t){return t.title;});
      var lines3=[c.name+(c.role?" ("+c.role+")":"")+": "+comp3+"✅ "+(ct3.length-comp3)+" pend"+(over3?" ⚠️"+over3+" vencidas":"")+(indef3.length?" | ♾️ indefinidas: "+indef3.join(", "):"")];
      ct3.forEach(function(t){
        var st3=SC[t.status]?SC[t.status].l:t.status;
        var tipo=t.indefinite?"♾️ Sin fecha fin":t.endDate?("📅 "+t.endDate+(t.endTime?" "+t.endTime:" (10:00 AM)")):"Sin fecha";
        var hist3=(t.history||[]).filter(function(h){return h.ts>=pvAgo30;});
        var baseInfo="  "+t.title+" ["+st3+"] "+tipo+(t.frequency?" | "+t.frequency:"");
        if(!hist3.length){lines3.push(baseInfo+" | Sin entregas en el período");return;}
        var aprov3=hist3.filter(function(h){return h.approved;}).length;
        var rechaz3=hist3.filter(function(h){return!h.approved;}).length;
        var pct3=Math.round(aprov3/hist3.length*100);
        var failMap3={};
        hist3.filter(function(h){return!h.approved;}).forEach(function(h){
          (h.criteriaResults||[]).filter(function(cr){return!cr.cumplido;}).forEach(function(cr){
            failMap3[cr.criterio]=(failMap3[cr.criterio]||0)+1;
          });
        });
        var failList3=Object.keys(failMap3).map(function(k){return k+"("+failMap3[k]+"x)";}).join(", ");
        var lastRep=(hist3.slice(-1)[0]||{}).report||"";
        lines3.push(baseInfo+": "+hist3.length+" entregas ✅"+aprov3+" ❌"+rechaz3+" "+pct3+"%"+(failList3?" | Fallados: "+failList3:"")+(lastRep?" | Último reporte: "+lastRep.slice(0,150):""));
        hist3.forEach(function(h){if(h.datos_extraidos)lines3.push("    📊 ["+h.date+"] Datos: "+h.datos_extraidos.slice(0,500));});
      });
      return lines3.join("\n");
    }).join("\n\n");
    var pvSys="Eres JARVIS, asistente analítico privado de Manuel, administrador de AgendaTeam. Hoy "+pvToday+".\n"+
      "Este chat es PRIVADO — solo Manuel puede verlo.\n\n"+
      "POLÍTICAS DE RECORDATORIOS AUTOMÁTICOS (las ejecuta AgendaTeam automáticamente cuando el app está abierto):\n"+
      "• Pre-aviso: 2 horas antes del vencimiento → JARVIS pregunta al colaborador por qué no ha completado la tarea y pide confirmación de nueva fecha.\n"+
      "• Recordatorio 90 min: mensaje motivador de JARVIS al colaborador.\n"+
      "• Recordatorio 60 min: mensaje directo del sistema ('Queda 1 hora — organiza tu tiempo').\n"+
      "• Recordatorio 30 min: mensaje urgente de JARVIS ('Presenta el soporte AHORA').\n"+
      "• Recordatorio 15 min: mensaje directo ('¡15 minutos para el cierre!').\n"+
      "• Recordatorio 5 min: mensaje directo ('¡URGENTE — reporta YA!').\n"+
      "• Al vencer: alerta de incumplimiento en el chat del colaborador pidiendo nueva fecha.\n"+
      "• Escalación: si pasa el umbral de tolerancia (diaria=2.4h, semanal=0.7días, mensual=3días) sin respuesta → 🚩 INCUMPLIMIENTO, jefe agregado al chat para mediación.\n"+
      "HORA POR DEFECTO: Toda tarea sin hora de entrega definida usa las 8:00 AM del último día hábil (L-V) del ciclo: diaria=hoy (o lunes si es finde), semanal=viernes de la semana, mensual=último viernes del mes. Esto aplica también para la cuenta regresiva de recordatorios.\n"+
      "Hora por defecto actualizada a 10:00 AM.\n"+
      "IMPORTANTE sobre recordatorios: se activan cuando faltan ≤91 minutos para el vencimiento. Las tareas indefinidas (sin fecha fin) SÍ reciben recordatorios escalonados — su vencimiento se calcula con la regla de 10 AM en el último día hábil del ciclo. Solo las tareas COMPLETADAS o CANCELADAS no reciben recordatorios. Los recordatorios no funcionan si el app está cerrado.\n\n"+
      "CAPACIDADES DE JARVIS: análisis cruzado, reportes por criterio/colaborador/tarea, tablas comparativas, tendencias, rankings, resúmenes ejecutivos, extracción de datos de imágenes validadas.\n\n"+
      "DATOS DEL EQUIPO (último mes):\n"+pvTeamData+"\n\n"+
      "Responde en español. Para reportes: usa tablas con | . Sé preciso y usa SOLO datos disponibles. Si Manuel pregunta algo sobre las políticas o el funcionamiento del sistema, respóndele con base en las políticas descritas arriba.";
    var pvHist=(state.messages[pvck]||[]).slice(-21,-1).map(function(m){
      return{role:m.from==="boss"?"user":"assistant",content:m.text.slice(0,800)};
    });
    var pvClean=[];for(var i=0;i<pvHist.length;i++){if(pvClean.length===0||pvHist[i].role!==pvClean[pvClean.length-1].role)pvClean.push(pvHist[i]);}
    var pvPrev=pvClean.concat([{role:"user",content:text}]);
    fetch("/.netlify/functions/claude",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,system:pvSys,messages:pvPrev})
    }).then(function(r){var ct=r.headers.get("content-type")||"";if(!ct.includes("json"))throw new Error("Servidor no disponible ("+r.status+").");return r.json();}).then(function(d){
      var txt=d.error?(d.error.type==="rate_limit_error"?"⏳ Mucho tráfico. Espera 1 minuto.":"⚠️ "+d.error.message):(d.content&&d.content[0]&&d.content[0].text)||"Sin respuesta.";
      state.messages[pvck].push({id:Date.now(),from:"ai",text:txt,ts:Date.now()});
      aiLoading=false;saveLocal();renderChat();
    }).catch(function(e){
      state.messages[pvck].push({id:Date.now(),from:"ai",text:"⚠️ Error: "+(e&&e.message||"Sin red"),ts:Date.now()});
      aiLoading=false;saveLocal();renderChat();
    });
    return;
  }

  if(isGroupChat){
    var ck=currentChatKey;
    var taskId=Number(ck.replace("group_",""));
    var gt=state.tasks.find(function(x){return x.id===taskId;});
    var gcols=gt&&Array.isArray(gt.assignedTo)?gt.assignedTo.map(function(id){return state.collaborators.find(function(c){return c.id===id;});}).filter(Boolean):[];
    var senderName=isBoss?"Manuel":(currentUser.name||"Colaborador");
    if(!state.messages[ck])state.messages[ck]=[];
    state.messages[ck].push({id:Date.now(),from:isBoss?"boss":currentUser.id,text:text,ts:Date.now()});
    gcols.forEach(function(c){if(!isBoss||c.id!==currentUser.id)sendNotif("collab_"+c.id,"👥 "+senderName+" (grupo)","\""+gt.title+"\": "+text.slice(0,60));});
    if(!isBoss)sendNotif("boss","👥 "+senderName+" (grupo)","\""+gt.title+"\": "+text.slice(0,60));
    saveLocal();renderChat();
    aiLoading=true;
    var gnames=gcols.map(function(c){return c.name;}).join(", ");
    var sys="Eres JARVIS, asistente de AgendaTeam. Tarea grupal: \""+gt.title+"\". Participantes: Manuel (JEFE), "+gnames+" (COLABORADORES).\n"+
      "LÍMITES ESTRICTOS: 1) NO puedes ver imágenes adjuntas. 2) NO puedes ejecutar validaciones ni cambiar estados — el sistema lo hace automáticamente. 3) NUNCA pidas a nadie que comparta archivos por chat — deben reportar desde la tarea. 4) Si no tienes la información, dilo claramente. 5) Basa tus respuestas SOLO en el historial de texto visible.\n"+
      "VALIDACIONES: EPP se valida visualmente. Ubicación SOLO por coordenadas GPS, nunca por apariencia del entorno. Si alguien reclama un rechazo, explica el criterio fallido sin ceder por iniciativa propia.\n"+
      "AUTORIDAD DE MANUEL: Sus instrucciones en este chat son DEFINITIVAS. La IA puede aportar contexto, los colaboradores pueden debatir, pero la decisión de Manuel se acata sin resistencia.\n"+
      "Facilita coordinación, máx 2 oraciones. Responde en español.";
    var hist=(state.messages[ck]||[]).filter(function(m){return m.from!=="system";}).slice(-5,-1).map(function(m){
      var isHuman=m.from==="boss"||typeof m.from==="number";
      return{role:isHuman?"user":"assistant",content:m.text.slice(0,200)};
    });
    var clean=[];for(var i=0;i<hist.length;i++){if(clean.length===0||hist[i].role!==clean[clean.length-1].role)clean.push(hist[i]);}
    var prev=clean.concat([{role:"user",content:"["+senderName+"]: "+text}]);
    fetch("/.netlify/functions/claude",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:300,system:sys,messages:prev})
    }).then(function(r){var ct=r.headers.get("content-type")||"";if(!ct.includes("json"))throw new Error("Servidor no disponible ("+r.status+").");return r.json();}).then(function(d){
      var txt=d.error?(d.error.type==="rate_limit_error"?"⏳ Mucho tráfico en este momento. Espera 1 minuto e intenta de nuevo.":"⚠️ "+d.error.message):(d.content&&d.content[0]&&d.content[0].text)||"Sin respuesta.";
      state.messages[ck].push({id:Date.now(),from:"ai",text:txt,ts:Date.now()});
      aiLoading=false;saveLocal();renderChat();
    }).catch(function(e){
      state.messages[ck].push({id:Date.now(),from:"ai",text:"⚠️ Error: "+(e&&e.message||"Sin red"),ts:Date.now()});
      aiLoading=false;saveLocal();renderChat();
    });
    return;
  }

  var cc=currentChatCollab||(isBoss?null:currentUser);
  if(!cc)return;
  var ck=collabCK(cc.id);
  if(!state.messages[ck])state.messages[ck]=[];
  state.messages[ck].push({id:Date.now(),from:isBoss?"boss":currentUser.id,text:text,ts:Date.now()});
  if(!isBoss&&/\d[\/\-]\d/.test(text))
    state.alerts.forEach(function(a){if(a.collabId===currentUser.id&&a.type==="first"&&!a.responded){a.responded=true;a.newDate=text;}});
  if(isBoss){sendNotif("collab_"+cc.id,"💬 Mensaje de Manuel",text.slice(0,80));}
  else{sendNotif("boss","💬 Mensaje de "+cc.name,text.slice(0,80));}
  saveLocal();renderChat();
  aiLoading=true;_aiLastTs=Date.now();
  var ct=state.tasks.filter(function(t){return taskBelongsTo(t,cc.id);});
  var today=new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});

  // Detalle completo de tareas con historial de entregas
  var taskDetail=ct.map(function(t){
    var st=SC[t.status]?SC[t.status].l:t.status;
    var ov=!t.indefinite&&t.endDate&&taskDue(t)<Date.now()&&t.status!=="completada";
    var lines=[t.title+" ["+st+(ov?" ⚠️":"")+"]"+(t.indefinite?" ♾️":(t.endDate?" — Entrega:"+t.endDate+(t.endTime?" "+t.endTime:""):""))];
    if(t.criteria)lines.push("  Criterios: "+t.criteria.slice(0,300));
    if(t.notes)lines.push("  Notas: "+t.notes.slice(0,150));
    // Últimas 5 entregas con reporte y criterios
    (t.history||[]).slice(-5).forEach(function(h){
      var hline="  Entrega "+h.date+": "+(h.approved?"✅ Aprobada":"❌ Rechazada");
      if(h.report)hline+=" | Reporte: "+h.report.slice(0,250);
      lines.push(hline);
      if(h.criteriaResults&&h.criteriaResults.length>0){
        h.criteriaResults.forEach(function(cr){
          lines.push("    "+(cr.cumplido?"✅":"❌")+" "+cr.criterio+(cr.detalle?": "+cr.detalle.slice(0,120):""));
        });
      }
      if(h.datos_extraidos)lines.push("    📊 Datos: "+h.datos_extraidos.slice(0,400));
    });
    return lines.join("\n");
  }).join("\n\n---\n")||"Sin tareas.";

  var totales="Total tareas:"+ct.length+" | Pendientes:"+ct.filter(function(t){return t.status==="pendiente";}).length+
    " | En progreso:"+ct.filter(function(t){return t.status==="en-progreso";}).length+
    " | Completadas:"+ct.filter(function(t){return t.status==="completada";}).length+
    " | Vencidas:"+ct.filter(function(t){return!t.indefinite&&t.endDate&&taskDue(t)<Date.now()&&t.status!=="completada";}).length;

  // Analítica cruzada para el jefe: todos los colaboradores, todas las tareas, último mes
  var teamSummary="";
  if(isBoss){
    var ago30=Date.now()-30*24*3600000;
    // Resumen de estado actual de equipo
    teamSummary="\nEQUIPO COMPLETO (estado actual):\n"+state.collaborators.map(function(c){
      var ct2=state.tasks.filter(function(t){return taskBelongsTo(t,c.id);});
      var comp=ct2.filter(function(t){return t.status==="completada";}).length;
      var pend=ct2.filter(function(t){return t.status!=="completada";}).length;
      var over=ct2.filter(function(t){return!t.indefinite&&t.endDate&&taskDue(t)<Date.now()&&t.status!=="completada";}).length;
      return c.name+(c.role?" ("+c.role+")":"")+": "+comp+"✅ "+pend+" pend"+(over?" ⚠️"+over+" vencidas":"");
    }).join("\n");
    // Analítica último mes: por colaborador y tarea con desglose de criterios
    var analytics=state.collaborators.map(function(c){
      var ct2=state.tasks.filter(function(t){return taskBelongsTo(t,c.id);});
      var taskStats=ct2.map(function(t){
        var hist=(t.history||[]).filter(function(h){return h.ts>=ago30;});
        if(!hist.length)return null;
        var aprov=hist.filter(function(h){return h.approved;}).length;
        var rechaz=hist.filter(function(h){return!h.approved;}).length;
        var pct=Math.round(aprov/hist.length*100);
        // Contar incumplimientos por criterio
        var failMap={};
        hist.filter(function(h){return!h.approved;}).forEach(function(h){
          (h.criteriaResults||[]).filter(function(cr){return!cr.cumplido;}).forEach(function(cr){
            failMap[cr.criterio]=(failMap[cr.criterio]||0)+1;
          });
        });
        var failList=Object.keys(failMap).map(function(k){return k+"("+failMap[k]+"x)";}).join(", ");
        return"  "+t.title+": "+hist.length+" entregas | ✅"+aprov+" ❌"+rechaz+" | "+pct+"% cumplimiento"+(failList?" | Criterios fallados: "+failList:"");
      }).filter(Boolean);
      if(!taskStats.length)return null;
      return c.name+(c.role?" ("+c.role+")":"")+":\n"+taskStats.join("\n");
    }).filter(Boolean);
    if(analytics.length)teamSummary+="\n\nANALÍTICA ÚLTIMO MES (30 días) — datos pre-calculados para reportes:\n"+analytics.join("\n\n");
  }

  var isEsc=state.alerts.some(function(a){return a.type==="escalated"&&a.collabId===cc.id;});
  var escalNote=isEsc?"⚠️ INCUMPLIMIENTO ACTIVO — pedir fecha concreta.\n":"";

  var sys="Eres JARVIS, asistente analítico de AgendaTeam. Hoy "+today+". "+escalNote+
    "ROLES: Manuel = JEFE (supervisa, NO sube evidencias). "+cc.name+(cc.role?" ("+cc.role+")":"")+" = COLABORADOR (ejecuta y sube evidencias).\n"+
    "TAREAS de "+cc.name+":\n"+taskDetail+"\n"+totales+teamSummary+"\n\n"+
    "CAPACIDADES: Puedes analizar datos del historial de entregas, comparar desempeño, identificar patrones, calcular porcentajes de cumplimiento, generar reportes estructurados y responder preguntas sobre la información registrada en el historial de este chat y en los datos de tareas. Usa TODA la información disponible arriba para dar respuestas precisas.\n"+
    "LÍMITES: 1) NO puedes ver imágenes adjuntas. 2) NO ejecutas validaciones ni cambias estados — el sistema lo hace. 3) NUNCA le pidas a Manuel que suba fotos. 4) NUNCA le pidas al colaborador compartir archivos por chat — debe reportar desde la tarea. 5) NUNCA inventes datos que no estén en el historial. 6) NUNCA especules sobre cuántas imágenes adjuntó el colaborador ni qué imágenes envió — solo reporta los criteriaResults registrados por el validador en el historial. Si el colaborador dice que ya envió las imágenes, responde que el validador analizó el soporte y el resultado está en el historial; no afirmes que faltaron imágenes a menos que el historial lo indique explícitamente.\n"+
    "VALIDACIONES: Explica criterios fallidos y cómo corregirlos. EPP se valida visualmente. Ubicación SOLO por GPS, nunca por apariencia del entorno.\n"+
    "AUTORIDAD DE MANUEL: Sus instrucciones son DEFINITIVAS. La IA puede aportar contexto, el colaborador puede debatir, pero la decisión de Manuel se acata.\n"+
    "Responde en español. Análisis y reportes: estructurados y detallados. Preguntas simples: máx 3 oraciones.";

  // Historial amplio: últimos 25 mensajes incluyendo sistema (excepto mensajes de estado "validando...")
  var allHist=(state.messages[ck]||[]).filter(function(m){return m.type!=="validating"&&m.type!=="biometric";}).slice(-26,-1).map(function(m){
    var isHuman=m.from==="boss"||typeof m.from==="number";
    var label=m.from==="boss"?"[Manuel]":m.from==="system"?"[Sistema]":"[IA]";
    if(!isHuman&&m.from!=="boss"&&typeof m.from==="number")label="["+cc.name+"]";
    return{role:isHuman?"user":"assistant",content:label+": "+m.text.slice(0,600)};
  });
  var clean=[];for(var i=0;i<allHist.length;i++){if(clean.length===0||allHist[i].role!==clean[clean.length-1].role)clean.push(allHist[i]);}
  var prev=clean.concat([{role:"user",content:(isBoss?"[Manuel]: ":"["+cc.name+"]: ")+text}]);
  fetch("/.netlify/functions/claude",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,system:sys,messages:prev})
  }).then(function(r){var ct=r.headers.get("content-type")||"";if(!ct.includes("json"))throw new Error("Servidor no disponible ("+r.status+").");return r.json();}).then(function(d){
    var txt=d.error?(d.error.type==="rate_limit_error"?"⏳ Mucho tráfico ahora. Espera 1 minuto e intenta de nuevo.":"⚠️ "+d.error.message):(d.content&&d.content[0]&&d.content[0].text)||"Sin respuesta.";
    state.messages[ck].push({id:Date.now(),from:"ai",text:txt,ts:Date.now()});
    aiLoading=false;saveLocal();renderChat();
  }).catch(function(e){
    state.messages[ck].push({id:Date.now(),from:"ai",text:"⚠️ Error de conexión: "+(e&&e.message||"Sin red"),ts:Date.now()});
    aiLoading=false;saveLocal();renderChat();
  });
}

// ── SHEET ──
function showSheet(title,body){
  closeSheet();
  var ov=document.createElement("div");ov.className="sheet-overlay";
  ov.onclick=function(e){if(e.target===ov)closeSheet();};
  var sh=document.createElement("div");sh.className="sheet";
  sh.innerHTML='<div class="sheet-handle"></div><div class="sheet-head"><h3>'+escH(title)+'</h3><button class="sheet-close" onclick="closeSheet()">✕</button></div><div class="sheet-body" id="sheet-body">'+body+'</div>';
  document.body.appendChild(ov);document.body.appendChild(sh);
  activeSheet={ov:ov,sh:sh};
}
function updateSheetBody(html){var b=document.getElementById("sheet-body");if(b)b.innerHTML=html;}
function closeSheet(){
  if(activeSheet){
    try{document.body.removeChild(activeSheet.ov);}catch(e){}
    try{document.body.removeChild(activeSheet.sh);}catch(e){}
    activeSheet=null;
  }
}

window.addEventListener("load",init);
</script>
