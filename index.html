<meta name="apple-mobile-web-app-capable" content="yes"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Sora',sans-serif;font-size:15px;color:#1a1d2e;background:#eef0f7;overflow:hidden;}
input,select,textarea,button{font-family:inherit;font-size:15px;}
input,select,textarea{-webkit-appearance:none;appearance:none;}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;}
::-webkit-scrollbar{display:none;}
#app{height:100%;display:flex;flex-direction:column;}
.hidden{display:none!important;}

/* ── HEADER ── */
#header{background:linear-gradient(135deg,#1a1d2e 0%,#2d3561 100%);color:#fff;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0;box-shadow:0 2px 12px rgba(26,29,46,.35);}
.logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:9px;letter-spacing:-.3px;}
.logo-dot{width:9px;height:9px;border-radius:50%;background:#27ae60;box-shadow:0 0 8px rgba(39,174,96,.7);}

/* ── TABS ── */
#tabs{background:#fff;border-bottom:1px solid #e8eaf0;display:flex;flex-shrink:0;padding:0 8px;gap:4px;}
.tab-btn{flex:1;padding:13px 4px;background:none;border:none;cursor:pointer;font-weight:700;font-size:13px;color:#b0b4c8;border-bottom:3px solid transparent;transition:color .2s,border-color .2s;letter-spacing:-.1px;}
.tab-btn.active{color:#1a1d2e;border-bottom-color:#4a6cf7;}

/* ── STAT CARDS ── */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 12px 0;flex-shrink:0;}
.stat-card{background:#fff;border-radius:14px;padding:11px 6px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.stat-num{font-weight:800;font-size:21px;line-height:1;}
.stat-lbl{font-size:10px;color:#aaa;margin-top:3px;font-weight:600;}

/* ── CONTENT & CARDS ── */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);}

/* ── BUTTONS ── */
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .1s;}
.btn:active{opacity:.85;transform:scale(.98);}
.btn-dark{background:linear-gradient(135deg,#1a1d2e,#2d3561);color:#fff;}
.btn-blue{background:linear-gradient(135deg,#4a6cf7,#5a8fe0);color:#fff;}
.btn-gray{background:#f0f2f7;color:#555;}
.btn-red{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px;}
.btn-block{width:100%;padding:14px;}

/* ── FORM FIELDS ── */
.field{margin-bottom:14px;}
.field label{display:block;font-weight:700;font-size:12px;color:#7a7f99;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid #e5e7ef;font-size:15px;outline:none;background:#fff;font-family:inherit;transition:border-color .2s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#4a6cf7;}
.field textarea{resize:vertical;min-height:70px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ── AVATAR ── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden;}

/* ── TASK ITEMS ── */
.task-item{background:#fff;border:1.5px solid #eef0f6;border-radius:16px;padding:15px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:box-shadow .2s;}
.task-item.overdue{border-color:#ffc8c8;background:linear-gradient(135deg,#fff 80%,#fff5f5);}
.task-item.done{opacity:.72;border-color:#d0eedd;background:linear-gradient(135deg,#fff 80%,#f5fff8);}

/* ── CHECKBOXES / RADIOS ── */
.ck-box{width:22px;height:22px;border-radius:6px;border:2px solid #d0d3e0;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.ck-box.on{background:linear-gradient(135deg,#1a1d2e,#2d3561);border-color:#1a1d2e;color:#fff;}
.ck-radio{width:22px;height:22px;border-radius:50%;border:2px solid #d0d3e0;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.ck-radio.on{border-color:#4a6cf7;}
.ck-radio.on::after{content:'';width:12px;height:12px;border-radius:50%;background:#4a6cf7;display:block;}
.ck-label{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#f7f8fc;border-radius:12px;cursor:pointer;margin-bottom:6px;transition:background .15s;}
.ck-label.on{background:#eef2ff;}

/* ── TASK TYPOGRAPHY ── */
.task-title{font-weight:700;font-size:15px;margin-bottom:8px;line-height:1.3;}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.badge{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.task-actions{display:flex;gap:6px;}
.task-act-btn{flex:1;padding:9px 4px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.task-act-btn:active{opacity:.8;}

/* ── TIMELINE ── */
.timeline{display:flex;gap:3px;margin-top:10px;align-items:center;}
.tl-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;cursor:default;position:relative;}
.tl-dot.green{background:#27ae60;}
.tl-dot.yellow{background:#f5a623;}
.tl-dot.red{background:#e74c3c;}
.tl-dot.empty{background:#e0e2ea;}
.tl-label{font-size:10px;color:#aaa;margin-left:4px;}

/* ── PIN PAD ── */
.pin-display{display:flex;gap:12px;justify-content:center;margin:22px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;background:#e5e7ef;border:2px solid #d0d3e0;transition:all .2s;}
.pin-dot.filled{background:#1a1d2e;border-color:#1a1d2e;transform:scale(1.1);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:0 auto;}
.pin-btn{background:#fff;border:1.5px solid #e8eaf0;border-radius:16px;padding:18px;font-size:22px;font-weight:700;cursor:pointer;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.06);transition:all .1s;}
.pin-btn:active{background:#f0f2f7;transform:scale(.95);}
.pin-btn.del{font-size:18px;color:#e74c3c;}

/* ── CHIPS ── */
#collab-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.chip{display:flex;align-items:center;gap:5px;border:1.5px solid #e8eaf0;border-radius:99px;padding:6px 12px;background:#f7f8fc;white-space:nowrap;font-size:13px;font-weight:600;transition:all .15s;}
.chip.active{background:linear-gradient(135deg,#1a1d2e,#2d3561);color:#fff;border-color:#1a1d2e;}

/* ── SHEET ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(15,18,35,.5);z-index:400;backdrop-filter:blur(2px);}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:401;max-height:93vh;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,.15);}
.sheet-handle{width:44px;height:4px;background:#dde0ea;border-radius:99px;margin:14px auto 4px;}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 14px;}
.sheet-head h3{font-weight:800;font-size:18px;}
.sheet-close{background:#f0f2f7;border:none;border-radius:99px;width:34px;height:34px;font-size:18px;cursor:pointer;color:#777;transition:background .15s;}
.sheet-close:active{background:#e0e2ea;}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 48px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:94px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1a1d2e,#2d3561);color:#fff;padding:12px 24px;border-radius:99px;font-weight:700;font-size:14px;z-index:999;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.3);display:none;letter-spacing:-.1px;}
#toast.error{background:linear-gradient(135deg,#e74c3c,#c0392b);}

/* ── CONFIRM DIALOG ── */
#confirm-overlay{position:fixed;inset:0;background:rgba(15,18,35,.55);z-index:9000;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);}
.confirm-box{background:#fff;border-radius:24px;padding:30px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.2);}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#1a1d2e 0%,#2d3561 60%,#3d4a8a 100%);display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;z-index:300;}
.login-card{background:#fff;border-radius:28px;padding:34px 22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);}

/* ── PHOTO ── */
.photo-circle{width:90px;height:90px;border-radius:50%;overflow:hidden;border:3px solid #e8eaf0;background:#f0f2f7;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 2px 12px rgba(0,0,0,.1);}
.photo-circle img{width:100%;height:100%;object-fit:cover;}
.photo-btns{display:flex;gap:10px;width:100%;}
.photo-btn{flex:1;padding:13px 8px;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;text-align:center;font-family:inherit;transition:opacity .15s;}
.photo-btn:active{opacity:.8;}

/* ── CHAT ── */
.msg-row{display:flex;gap:8px;margin-bottom:12px;}
.msg-row.me{justify-content:flex-end;}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px;box-shadow:0 1px 4px rgba(0,0,0,.15);}
.msg-bubble{max-width:82%;padding:11px 15px;font-size:14px;line-height:1.6;white-space:pre-wrap;border-radius:4px 18px 18px 18px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.msg-bubble.me{background:linear-gradient(135deg,#1a1d2e,#2d3561);color:#fff;border-radius:18px 4px 18px 18px;}
.msg-bubble.ai,.msg-bubble.other{background:#f0f2f7;color:#1a1d2e;}
.msg-bubble.system{background:#fff8ec;color:#1a1d2e;border-left:3px solid #f5a623;}
.msg-bubble.flag{background:#fff0f0;color:#c0392b;border:1.5px solid #ffcccc;}
.msg-bubble.boss_msg{background:linear-gradient(135deg,#eef0ff,#e8eaf6);color:#1a1d2e;}
.msg-bubble.biometric{background:linear-gradient(135deg,#eafaf1,#d5f5e3);color:#1a1d2e;border-left:3px solid #27ae60;}
.msg-time{font-size:10px;opacity:.45;margin-top:5px;text-align:right;}
.chat-input-row{display:flex;gap:8px;padding-top:10px;border-top:1px solid #eef0f7;flex-shrink:0;}
.chat-input{flex:1;padding:12px 18px;border-radius:99px;border:1.5px solid #e5e7ef;font-size:15px;outline:none;background:#f7f8fc;font-family:inherit;transition:border-color .2s;}
.chat-input:focus{border-color:#4a6cf7;background:#fff;}
.chat-send{background:linear-gradient(135deg,#1a1d2e,#2d3561);color:#fff;border:none;border-radius:50%;width:46px;height:46px;font-size:20px;cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(26,29,46,.4);transition:transform .1s;}
.chat-send:active{transform:scale(.92);}

/* ── CANDADO DE UBICACIÓN ── */
#geo-gate{position:fixed;inset:0;background:linear-gradient(160deg,#1a1d2e 0%,#2d3561 60%,#3d4a8a 100%);display:flex;align-items:center;justify-content:center;padding:24px;z-index:500;overflow-y:auto;}

/* ── PRUEBA DE VIDA (cámara en vivo) ── */
#live-overlay{position:fixed;inset:0;background:#000;z-index:700;display:flex;align-items:center;justify-content:center;}
.live-box{width:100%;max-width:480px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px;}
#live-video{width:100%;max-height:58vh;border-radius:22px;background:#111;transform:scaleX(-1);object-fit:cover;}
.live-msg{color:#fff;font-weight:800;font-size:19px;text-align:center;min-height:28px;line-height:1.3;}
#live-actions{width:100%;}
.live-cancel{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;font-size:14px;}

/* ── MENU DE INICIO (botones grandes) ── */
#menu-screen{position:fixed;inset:0;background:linear-gradient(160deg,#eef0f7 0%,#e3e7f5 100%);z-index:250;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.menu-wrap{max-width:540px;margin:0 auto;padding:0 16px 40px;}
.menu-header{height:58px;display:flex;align-items:center;justify-content:space-between;}
.menu-header .logo{color:#1a1d2e;}
.menu-greet{font-weight:800;font-size:25px;color:#1a1d2e;margin:12px 4px 22px;letter-spacing:-.6px;}
.menu-greet span{display:block;font-weight:600;font-size:14px;color:#8a90a8;margin-top:5px;letter-spacing:0;}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.menu-card{background:#fff;border:none;border-top:4px solid var(--mc,#4a6cf7);border-radius:22px;padding:28px 14px;cursor:pointer;box-shadow:0 4px 16px rgba(26,29,46,.08);display:flex;flex-direction:column;align-items:center;gap:12px;transition:transform .12s,box-shadow .12s;font-family:inherit;}
.menu-card:active{transform:scale(.96);box-shadow:0 2px 8px rgba(26,29,46,.12);}
.menu-ico{font-size:42px;line-height:1;}
.menu-lbl{font-weight:800;font-size:15px;color:#1a1d2e;text-align:center;letter-spacing:-.2px;}
</style>
</head>
<body>

    <div class="logo"><div class="logo-dot"></div>AgendaTeam</div>

      <div id="flag-badge" class="hidden" style="background:#e74c3c;color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;"></div>
      <button id="notif-btn" onclick="requestNotifPermission()" title="Activar notificaciones" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px;">🔔</button>

</div>
<input type="file" id="att-cam" accept="image/*" capture="user" style="display:none">

<div id="report-dialog-overlay" style="display:none;position:fixed;inset:0;background:rgba(15,18,35,.55);z-index:9001;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);">
  <div id="report-dialog-box" style="background:#fff;border-radius:24px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.2);"></div>
</div>
<div id="confirm-overlay" style="display:none;flex-direction:column;">
  <div class="confirm-box">
    <div style="font-size:36px;margin-bottom:10px">⚠️</div>
    <p id="confirm-msg" style="font-weight:800;font-size:16px;margin-bottom:6px;"></p>
    <p id="confirm-sub" style="font-size:13px;color:#999;margin-bottom:22px;"></p>
    <div style="display:flex;gap:10px;">
      <button id="confirm-ok-btn" class="btn btn-red btn-block" onclick="confirmOk()" style="flex:1">Eliminar</button>
      <button class="btn btn-gray btn-block" onclick="closeConfirm()" style="flex:1">Cancelar</button>
    </div>
  </div>
</div>
<script>
var BOSS_PIN="716402";
var VALIDADOR_PIN="135790";

try{
  if(typeof firebase!=="undefined"){
    if(!firebase.apps||!firebase.apps.length){

        storageBucket:"agenda-team-tktk.firebasestorage.app",

        appId:"1:619990372047:web:ac394ad3d453bcdfb2b1ba"
      });

    db=firebase.firestore();
    // Persistencia offline: las escrituras fallidas se reintentan automáticamente al recuperar red
    db.enablePersistence().catch(function(e){
      if(e.code!=="failed-precondition"&&e.code!=="unimplemented")console.warn("persistence:",e);

}catch(e){console.warn("Firebase init:",e);}

var VAPID_KEY="BAmQh9W30ycVNv075wYZKEIArPB7V6r7mLIFRJtaHPn_-7l04BHfhgsKV2OvenT80kbnKED69ow4_7h1eMqG7Fo";
var fcmMessaging=null;
var CLOUDINARY_CLOUD="dzwm1f3o8";
var CLOUDINARY_PRESET="AgendaTeam";
var _evidenceFiles=[];
var _evidenceCoords=[]; // coords paralelas por archivo: {lat,lng,acc} o null

function uploadEvidence(taskId,files,coordsList,onProgress,onDone,onError){
  var urls=[],total=files.length,done=0;
  if(!total){onDone([]);return;}
  // Progreso total: acumular bytes de todos los archivos
  var filesSizes=Array.from(files).map(function(f){return f.size||0;});
  var totalBytes=filesSizes.reduce(function(a,b){return a+b;},0)||1;
  var loadedByFile=new Array(total).fill(0);
  Array.from(files).forEach(function(file,idx){
    var fileCoord=(coordsList&&coordsList[idx])||null;
    var ftype=file.type||"";
    var fname=file.name||"";
    var fext=(fname.split(".").pop()||"").toLowerCase();
    var isImg=ftype.indexOf("image")>=0||ftype.indexOf("video")>=0||["jpg","jpeg","png","gif","webp","heic","heif"].indexOf(fext)>=0;
    var isVid=ftype.indexOf("video")>=0||["mp4","mov","avi","webm"].indexOf(fext)>=0;
    var resource=isImg?(isVid?"video":"image"):"raw";
    var fd=new FormData();
    fd.append("file",file);
    fd.append("upload_preset",CLOUDINARY_PRESET);
    fd.append("folder","agendateam/evidence/"+taskId);
    var xhr=new XMLHttpRequest();
    xhr.open("POST","https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD+"/"+resource+"/upload");
    xhr.upload.onprogress=function(e){
      if(e.lengthComputable){loadedByFile[idx]=e.loaded;var tot=loadedByFile.reduce(function(a,b){return a+b;},0);onProgress&&onProgress(Math.round(tot/totalBytes*100));}
    };
    xhr.onload=function(){
      var res=JSON.parse(xhr.responseText);
      if(res.secure_url){
        // Normalizar type: si vino vacío, usar el del servidor o derivar de extensión
        var resolvedType=ftype||res.resource_type+"/"+res.format||"image/jpeg";
        var att={url:res.secure_url,name:fname,type:resolvedType,size:file.size,public_id:res.public_id};
        if(fileCoord)att.coords=fileCoord;
        urls.push(att);
        done++;
        if(done===total)onDone(urls);
      }else{onError(res.error&&res.error.message||"Error Cloudinary");}
    };
    xhr.onerror=function(){onError("Error de red al subir "+fname);};
    xhr.send(fd);
  });
}

function getFileIcon(type,name){
  if(!type&&name){var ext=(name.split('.').pop()||"").toLowerCase();
    if(["jpg","jpeg","png","gif","webp"].indexOf(ext)>=0)type="image/";
    else if(ext==="pdf")type="application/pdf";
    else if(["xls","xlsx"].indexOf(ext)>=0)type="excel";
    else if(["doc","docx"].indexOf(ext)>=0)type="word";
  }
  if((type||"").indexOf("image")>=0)return"🖼️";
  if((type||"").indexOf("pdf")>=0)return"📄";
  if((type||"").indexOf("excel")>=0||(type||"").indexOf("spreadsheet")>=0)return"📊";
  if((type||"").indexOf("word")>=0||(type||"").indexOf("document")>=0)return"📝";
  if((type||"").indexOf("video")>=0)return"🎥";
  if((type||"").indexOf("audio")>=0)return"🎵";
  return"📎";
}

function startSync(){
  if(!db)return;
  db.collection("at").doc("data").onSnapshot(function(snap){
    if(!snap.exists)return;
    var d=snap.data();
    var pm={};
    state.collaborators.forEach(function(c){if(c.photo)pm[c.id]=c.photo;});
    // Preservar status, historial, requiredEvidence y mensajes locales para evitar que onSnapshot sobreescriba cambios no guardados
    var localStatuses={},localHistories={},localReqEvidence={};
    state.tasks.forEach(function(t){
      localStatuses[t.id]=t.status;
      localHistories[t.id]=t.history||[];
      if(t.requiredEvidence)localReqEvidence[t.id]=t.requiredEvidence;
    });
    // Guardar mensajes locales antes de reemplazar el estado
    var localMessages=state.messages||{};
    state=Object.assign({collaborators:[],tasks:[],messages:{},alerts:[],references:[],taskTemplates:[],locations:[],attendance:[],activities:[]},d);
    state.tasks=state.tasks.map(function(t){
      var ls=localStatuses[t.id];
      var lh=localHistories[t.id]||[];
      // Preservar status si hay cambio local pendiente (completada o validación)
      if(ls&&ls!==t.status&&(ls==="completada"||t.status==="pendiente_validacion"))t.status=ls;
      // Preservar historial si el local tiene más entradas (aún no sincronizadas con Firestore)
      if(lh.length>(t.history||[]).length)t.history=lh;
      // Preservar requiredEvidence local si Firestore aún no tiene la versión actualizada
      var lre=localReqEvidence[t.id];
      if(lre&&(!t.requiredEvidence||(lre.photo&&!t.requiredEvidence.photo)||(lre.image&&!t.requiredEvidence.image)||(lre.document&&!t.requiredEvidence.document)))t.requiredEvidence=lre;
      return t;
    });
    // Fusionar mensajes locales que aún no llegaron a Firestore (evita race condition del validador)
    Object.keys(localMessages).forEach(function(key){
      var localMsgs=localMessages[key]||[];
      var remoteMsgs=state.messages[key]||[];
      var remoteIds={};remoteMsgs.forEach(function(m){remoteIds[m.id]=true;});
      var pendingLocal=localMsgs.filter(function(m){return!remoteIds[m.id];});
      if(pendingLocal.length){
        state.messages[key]=(remoteMsgs.concat(pendingLocal)).sort(function(a,b){return(a.ts||0)-(b.ts||0);});
      }
    });
    state.collaborators=state.collaborators.map(function(c){return Object.assign({},c,{photo:c.photo||pm[c.id]||""});});
    // Solo guardar en localStorage (no disparar saveCloud: acabamos de recibir datos de Firestore)
    try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}
    if(currentUser)render();
  },function(e){console.warn("sync:",e);});
}
var OT={diaria:2.4*3600000,semanal:.7*86400000,mensual:3*86400000};
var CD={diaria:86400000,semanal:7*86400000,mensual:30*86400000};
function lastWeekday(d){
  // Retrocede d hasta el viernes si cae en sábado o domingo
  var wd=d.getDay();
  if(wd===0)d.setDate(d.getDate()-2); // domingo → viernes
  else if(wd===6)d.setDate(d.getDate()-1); // sábado → viernes
  return d;
}
function taskDue(t){
  // Si tiene fecha fin explícita
  if(t.endDate){
    if(t.endTime)return new Date(t.endDate+'T'+t.endTime).getTime();
    // Sin hora: usar 8:00 AM por defecto
    return new Date(t.endDate+'T10:00').getTime();
  }
  // Sin fecha fin: último día HÁBIL del ciclo a las 8:00 AM (o la hora definida)
  var now=new Date();
  var d;
  if(t.frequency==="semanal"){
    // Cierre de ciclo = viernes de la semana actual a las 8 AM
    var day=now.getDay(); // 0=dom,1=lun,...,5=vie,6=sab
    var diffToFri=day===0?-2:day===6?-1:5-day; // días hasta el viernes de esta semana
    d=new Date(now);d.setDate(now.getDate()+diffToFri);
  }else if(t.frequency==="mensual"){
    // Último día hábil del mes actual
    d=lastWeekday(new Date(now.getFullYear(),now.getMonth()+1,0));
  }else{
    // Diaria: hoy si es L-V; si es fin de semana, el próximo lunes
    d=new Date(now);
    var dow=d.getDay();
    if(dow===6){d.setDate(d.getDate()+2);}
    else if(dow===0){d.setDate(d.getDate()+1);}
  }
  if(t.endTime){
    var parts=t.endTime.split(":");
    d.setHours(Number(parts[0]),Number(parts[1]),0,0);
  }else{
    d.setHours(10,0,0,0); // Default: 10:00 AM
  }
  return d.getTime();
}
function cycleStart(t){
  var ref=t.startDate?new Date(t.startDate).getTime():taskDue(t);
  var now=Date.now();
  if(t.frequency==="mensual"){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime();}
  var dur=t.frequency==="semanal"?CD.semanal:CD.diaria;
  var n=Math.floor((now-ref)/dur);
  return ref+n*dur;
}

function compressImg(file,cb){
  var fr=new FileReader();
  fr.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var MAX=220,sc=Math.min(MAX/img.width,MAX/img.height,1);
      var cv=document.createElement("canvas");
      cv.width=img.width*sc;cv.height=img.height*sc;
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL("image/jpeg",.65));
    };
    img.src=e.target.result;
  };
  fr.readAsDataURL(file);
}

function pinPress(val){
  var errEl=document.getElementById("pin-error");
  if(errEl)errEl.textContent="";
  if(val==="⌫"){pinBuffer=pinBuffer.slice(0,-1);updatePinDisplay();return;}
  if(pinBuffer.length>=6)return;
  pinBuffer+=val;
  updatePinDisplay();
  if(pinBuffer.length===6){
    setTimeout(function(){
      if(pinTarget==="boss"){
        if(pinBuffer===BOSS_PIN){loginBoss();}
        else{pinBuffer="";updatePinDisplay();if(errEl)errEl.textContent="PIN incorrecto";}
      }else if(pinTarget==="validador"){
        if(pinBuffer===VALIDADOR_PIN){loginValidador();}
        else{pinBuffer="";updatePinDisplay();if(errEl)errEl.textContent="PIN incorrecto";}
      }else if(pinTarget){
        var c=state.collaborators.find(function(x){return x.id===pinTarget;});
        if(c&&pinBuffer===c.pin){loginCollab(c.id);}
        else{pinBuffer="";updatePinDisplay();if(errEl)errEl.textContent="PIN incorrecto";}
      }
    },200);

// ── ALERTS ──
function aiNotify(ck,sys,userText){
  if(!state.messages[ck])state.messages[ck]=[];
  fetch("/.netlify/functions/claude",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:120,system:sys,messages:[{role:"user",content:userText}]})
  }).then(function(r){return r.json();}).then(function(d){
    var txt=(d.content&&d.content[0]&&d.content[0].text)||(d.error?"⚠️ "+d.error.message:"Sin respuesta.");
    state.messages[ck].push({id:Date.now(),from:"ai",text:txt,ts:Date.now()});
    saveLocal();
  }).catch(function(){});
}

function runAlerts(){
  var now=Date.now(),changed=false;
  var _dowA=new Date().getDay(); // 0=dom, 6=sab
  state.tasks.forEach(function(task){
    if(task.status==="completada"||task.indefinite||!task.endDate)return;
    // Tareas diarias sin fecha explícita no aplican fin de semana
    if((task.frequency==="diaria"||!task.frequency)&&(_dowA===0||_dowA===6))return;
    var due=taskDue(task);
    var thresh=OT[task.frequency]||OT.diaria;
    var col=state.collaborators.find(function(c){return c.id===task.assignedTo;});
    if(!col)return;
    var wid="w_"+task.id,aid="a_"+task.id,eid="e_"+task.id;
    var ck=collabCK(task.assignedTo);
    // Pre-warning: 2h before due, while not yet overdue
    if(now>=due-2*3600000&&now<due&&!state.alerts.find(function(a){return a.id===wid;})){
      state.alerts.push({id:wid,taskId:task.id,collabId:task.assignedTo,type:"pre_warn",ts:now});
      var sys="Eres JARVIS, asistente de AgendaTeam. La tarea \""+task.title+"\" de "+col.name+" vence en menos de 2 horas. Pregúntale amablemente por qué aún no ha completado la tarea y pídele que confirme una nueva fecha y hora de culminación si no podrá completarla a tiempo. Responde en español, máximo 3 oraciones.";
      aiNotify(ck,sys,"Alerta pre-vencimiento de tarea.");
      changed=true;
    }
    if(now<due)return;
    var over=now-due;
    // First alert: task just overdue
    if(!state.alerts.find(function(a){return a.id===aid;})){
      if(!state.messages[ck])state.messages[ck]=[];
      state.messages[ck].push({id:Date.now()+Math.random(),from:"system",type:"alert_request",ts:now,
        text:"⚠️ Hola "+col.name.split(" ")[0]+", la tarea *\""+task.title+"\"* venció el "+task.endDate+(task.endTime?" "+task.endTime:"")+".\n\n¿Puedes confirmar una nueva fecha y hora para completarla?"});
      state.alerts.push({id:aid,taskId:task.id,collabId:task.assignedTo,type:"first",ts:now,responded:false,newDate:null});
      changed=true;
    }
    // Escalation: overdue > threshold → flag in shared channel
    var fa=state.alerts.find(function(a){return a.id===aid;});
    if(fa&&!state.alerts.find(function(a){return a.id===eid;})){
      var overThresh=over>thresh,badDate=fa.newDate&&(new Date(fa.newDate).getTime()-due)>thresh;
      if(overThresh||badDate){
        if(!state.messages[ck])state.messages[ck]=[];
        var reason=badDate?"La nueva fecha propuesta supera el margen permitido.":"Sin respuesta en el tiempo permitido.";
        state.messages[ck].push({id:Date.now()+Math.random(),from:"system",flag:true,type:"escalated",ts:now,
          text:"🚩 INCUMPLIMIENTO — \""+task.title+"\"\nColaborador: "+col.name+"\nFrecuencia: "+task.frequency+"\n"+reason+"\n\nEl jefe ha sido notificado y está en este chat."});
        state.alerts.push({id:eid,taskId:task.id,collabId:task.assignedTo,type:"escalated",ts:now});
        var sys2="Eres mediador en AgendaTeam. Hay un incumplimiento de la tarea \""+task.title+"\" asignada a "+col.name+". El jefe y el colaborador están en este mismo chat contigo. Resume la situación y pídeles que acuerden un nuevo compromiso concreto de fecha y hora. Responde en español, máximo 4 oraciones.";
        aiNotify(ck,sys2,"Inicio de mediación por incumplimiento.");
        sendNotif("boss","🚩 Incumplimiento","\""+task.title+"\" — "+col.name+" requiere atención.");
        sendNotif("collab_"+task.assignedTo,"🚩 Chat de seguimiento","El jefe ha sido agregado al chat por incumplimiento.");
        changed=true;
      }
    }
  });
  if(changed)saveLocal();
}

// ── RECORDATORIOS ESCALONADOS ──
function runReminders(){
  var now=Date.now(),changed=false;
  var today=new Date().toISOString().slice(0,10);
  var _dowR=new Date().getDay(); // 0=dom, 6=sab
  // Limpiar recordatorios de días anteriores para no acumular el array
  state.alerts=state.alerts.filter(function(a){
    if(!a.type||a.type.indexOf("rem")<0)return true;
    return a.date===today;
  });
  state.tasks.forEach(function(task){
    if(task.status==="completada"||task.status==="cancelada")return;
    // Tareas diarias no aplican fin de semana
    if((task.frequency==="diaria"||!task.frequency)&&(_dowR===0||_dowR===6))return;
    var due=taskDue(task);
    var diff=due-now;
    if(diff<=0||diff>91*60000)return; // ya venció o faltan más de 91 min
    var isGroupTask=task.isGroup&&Array.isArray(task.assignedTo);
    var assignees=isGroupTask?task.assignedTo:(task.assignedTo?[task.assignedTo]:[]);
    assignees.filter(Boolean).forEach(function(collabId){
      var col=state.collaborators.find(function(c){return c.id===collabId;});
      if(!col)return;
      var ck=isGroupTask&&task.groupKey?task.groupKey:collabCK(collabId);
      var tname="\""+task.title+"\"";
      var ttime=task.endTime?" a las "+task.endTime:"";
      // Checkpoints: {umbral en min, id, useAI, mensaje directo, texto notif}
      var cps=[
        {min:90,id:"rem90",useAI:true,notif:"⏰ 1h 30min para entregar — prepara tu soporte."},
        {min:60,id:"rem60",useAI:false,
         msg:"⏰ *Recordatorio — queda 1 hora*\n\nFalta 1 hora para presentar el soporte de *"+tname+"*"+(task.endTime?"\n🕐 Hora límite: "+task.endTime:"")+". ¡Organiza tu tiempo y ten lista tu evidencia!",
         notif:"⏰ 1 hora restante. ¡Prepara tu soporte!"},
        {min:30,id:"rem30",useAI:true,notif:"🔔 ¡30 minutos! Presenta tu soporte ahora."},
        {min:15,id:"rem15",useAI:false,
         msg:"🚨 *¡15 minutos para el cierre!*\n\nLa tarea *"+tname+"* vence en 15 minutos"+(task.endTime?" ("+task.endTime+")":"")+". Ingresa a AgendaTeam y presenta tu soporte de inmediato.",
         notif:"🚨 ¡15 minutos! Ingresa y reporta ya."},
        {min:5,id:"rem5",useAI:false,
         msg:"🔴 *¡URGENTE — 5 minutos!*\n\nEl tiempo para presentar *"+tname+"* está por agotarse. ¡Reporta AHORA antes de que cierre el ciclo!",
         notif:"🔴 ¡5 minutos! Último aviso — reporta ya."}
      ];
      cps.forEach(function(cp){
        if(diff>cp.min*60000)return; // aún no llega a este umbral
        var rid=cp.id+"_"+task.id+"_"+collabId+"_"+today;
        if(state.alerts.find(function(a){return a.id===rid;}))return; // ya enviado
        state.alerts.push({id:rid,taskId:task.id,collabId:collabId,type:cp.id,date:today,ts:now});
        if(cp.useAI){
          var urgLevel=cp.min===90?"en 1 hora y 30 minutos":"en 30 minutos";
          var tone=cp.min===90?"motivador y amable, menciona que debe organizar su tiempo":"urgente y directo, pídele que presente el soporte AHORA";
          var sys="Eres JARVIS, asistente de AgendaTeam. La tarea "+tname+" de "+col.name.split(" ")[0]+" vence "+urgLevel+ttime+". Envía un recordatorio "+tone+". Máximo 2 oraciones. Responde en español.";
          aiNotify(ck,sys,"Recordatorio "+cp.min+" min antes del vencimiento.");
        }else{
          if(!state.messages[ck])state.messages[ck]=[];
          state.messages[ck].push({id:Date.now()+Math.random(),from:"ai",text:cp.msg,ts:now});
        }
        sendNotif("collab_"+collabId,"📋 AgendaTeam — "+col.name.split(" ")[0],cp.notif+" ("+task.title+")");
        changed=true;
      });
    });
  });
  if(changed){
    saveLocal();
    if(currentChatKey)renderChat();
  }
}

// ── COUNTDOWN ──
function timeCountdown(t){
  if(t.status==="completada")return"";
  // Tareas diarias sin fecha explícita no aplican fin de semana
  if(!t.endDate&&(t.frequency==="diaria"||!t.frequency)){
    var _dow=new Date().getDay();
    if(_dow===6||_dow===0){
      return'<span class="badge" style="background:#f0f7ff;color:#4a90d9;font-weight:700;">📅 Retoma el lunes</span>';
    }
  }
  var due=taskDue(t);
  var diff=due-Date.now();
  var abs=Math.abs(diff);
  var d=Math.floor(abs/86400000);
  var h=Math.floor((abs%86400000)/3600000);
  var m=Math.floor((abs%3600000)/60000);
  var str="",color="",bg="";
  if(diff<0){
    str=d>0?d+"d "+h+"h vencida":h>0?h+"h "+m+"min vencida":m+"min vencida";
    color="#e74c3c";bg="#fff0f0";
  }else if(diff<3600000){
    str=m+"min restantes";color="#e74c3c";bg="#fff0f0";
  }else if(diff<86400000){
    str=h+"h "+m+"min restantes";color="#e67e22";bg="#fff8ec";
  }else{
    str=d+"d "+h+"h restantes";color="#27ae60";bg="#eafaf1";
  }
  return'<span class="badge" style="background:'+bg+';color:'+color+';font-weight:800;">⏱ '+str+'</span>';
}

// ── TIMELINE ──
function timelineHTML(task){
  var history=task.history||[];
  // UN punto POR DÍA con el mejor resultado del día (verde > amarillo > rojo)
  function rank(r){return r==="green"?2:(r==="yellow"?1:0);}
  var byDay={},order=[];
  history.forEach(function(h){
    var d=h.date||"";var rk=rank(h.result);
    if(!(d in byDay)){byDay[d]={rk:rk,ts:h.ts||0};order.push(d);}
    else{if(rk>byDay[d].rk)byDay[d].rk=rk;if((h.ts||0)>byDay[d].ts)byDay[d].ts=h.ts||0;}
  });
  order.sort(function(a,b){return byDay[a].ts-byDay[b].ts;});
  var days=order.slice(-20);
  var slots=[];for(var i=0;i<20-days.length;i++)slots.push(null);days.forEach(function(d){slots.push(d);});
  var dots=slots.map(function(d){
    if(!d)return'<div class="tl-dot empty" title="Sin registro"></div>';
    var rk=byDay[d].rk;
    var col=rk===2?"green":rk===1?"yellow":"red";
    var label=rk===2?"✓ Cumplida":rk===1?"⚠ Parcial / sin EPP completas":"✗ No cumplida";
    return'<div class="tl-dot '+col+'" title="'+label+' - '+escH(d)+'"></div>';
  }).join("");
  var legend='<span style="font-size:10px;color:#aaa;margin-left:4px;">Últimos '+Math.min(days.length,20)+' días</span>';
  return'<div style="margin-top:10px;padding-top:10px;border-top:1px solid #f0f2f7;">'+
    '<div style="font-size:11px;color:#999;margin-bottom:6px;font-weight:700;">📊 Historial de cumplimiento (por día)</div>'+
    '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:3px;">'+dots+legend+'</div>'+
    '<div style="display:flex;gap:12px;margin-top:6px;">'+
    '<span style="font-size:10px;color:#27ae60;font-weight:700;">🟢 Cumplida</span>'+
    '<span style="font-size:10px;color:#f5a623;font-weight:700;">🟡 Parcial</span>'+
    '<span style="font-size:10px;color:#e74c3c;font-weight:700;">🔴 No cumplida</span>'+
    '</div></div>';
}

// ── UBICACIÓN OBLIGATORIA (se obtiene desde el inicio y se mantiene viva) ──
var _lastGeo=null,_geoStarted=false;
function _geocode(coord,after){
  fetch("https://nominatim.openstreetmap.org/reverse?lat="+coord.lat+"&lon="+coord.lng+"&format=json&accept-language=es",{headers:{"User-Agent":"AgendaTeam/1.0"}})
    .then(function(r){return r.json();}).then(function(geo){
      if(geo&&geo.address){
        var a=geo.address;
        var parts=[a.road||a.pedestrian||a.footway||"",a.neighbourhood||a.suburb||a.quarter||a.city_district||"",a.city||a.town||a.village||a.municipality||"",a.state||""].filter(Boolean);
        coord.address=parts.slice(0,3).join(", ");
        if(_lastGeo&&_lastGeo.lat===coord.lat&&_lastGeo.lng===coord.lng)_lastGeo.address=coord.address;
        if(after)after(coord);
      }
    }).catch(function(){});
}
function onGeo(pos){
  var coord={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy),ts:Date.now()};
  var prev=_lastGeo;
  if(prev&&prev.address&&prev.lat!=null&&haversineMeters(prev.lat,prev.lng,coord.lat,coord.lng)<60){coord.address=prev.address;coord._addrTs=prev._addrTs;}
  _lastGeo=coord;
  if(!coord.address||!coord._addrTs||Date.now()-coord._addrTs>90000){coord._addrTs=Date.now();_geocode(coord);}
}
// Arranca el rastreo de ubicación al ingresar (permiso concedido desde el principio)
function startGeoTracking(){
  if(_geoStarted||!navigator.geolocation)return;_geoStarted=true;
  navigator.geolocation.getCurrentPosition(onGeo,function(e){
    if(e&&e.code===1)toast("📍 Activa la ubicación para registrar tu jornada","error");
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  try{navigator.geolocation.watchPosition(onGeo,function(){},{enableHighAccuracy:true,timeout:20000,maximumAge:30000});}catch(e){}
}
// Devuelve la ubicación ya disponible (cache) y de fondo la refina
function getGeo(cb){
  if(_lastGeo&&Date.now()-(_lastGeo.ts||0)<120000)cb(_lastGeo);
  if(!navigator.geolocation){if(!_lastGeo)cb(null);return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    onGeo(pos);var g=_lastGeo;cb(g);
    if(!g.address)_geocode(g,function(gg){cb(gg,true);});
  },function(){if(!_lastGeo)cb(null);},{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}
// ── CANDADO: el permiso de ubicación es obligatorio para entrar ──
var _geoGateNext=null;
function requireLocationThen(next){
  _geoGateNext=next;
  if(!navigator.geolocation){next();return;} // dispositivo sin GPS: entra (registros con bandera roja)
  navigator.geolocation.getCurrentPosition(function(pos){
    onGeo(pos);_geoStarted=false;startGeoTracking();hideGeoGate();next();
  },function(err){
    if(err&&err.code===1){showGeoGate();} // PERMISO DENEGADO → bloquear hasta conceder
    else{startGeoTracking();hideGeoGate();next();} // no disponible/timeout → entra con bandera roja, sigue intentando
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function showGeoGate(){
  var g=document.getElementById("geo-gate");
  g.innerHTML='<div class="login-card" style="text-align:center;">'+
    '<div style="font-size:54px;margin-bottom:12px;">📍</div>'+
    '<h1 style="font-weight:800;font-size:22px;margin-bottom:10px;letter-spacing:-.4px;">Ubicación requerida</h1>'+
    '<p style="color:#666;font-size:14px;line-height:1.65;margin-bottom:22px;">Para usar AgendaTeam debes permitir el acceso a tu ubicación. Tu jornada y actividades se registran con GPS.</p>'+
    '<button class="btn btn-dark btn-block" style="border-radius:14px;font-size:16px;" onclick="retryGeo()">Conceder ubicación</button>'+
    '<p style="color:#aaa;font-size:12px;margin-top:14px;line-height:1.5;">Si ya la negaste, actívala en los ajustes de ubicación del navegador y vuelve a intentar.</p>'+
  '</div>';
  g.classList.remove("hidden");
}
function retryGeo(){requireLocationThen(_geoGateNext);}
function hideGeoGate(){document.getElementById("geo-gate").classList.add("hidden");}

// Sitio de la marca: BODEGA TKTK = ok (verde) · otro sitio registrado = amarillo · ninguno = rojo
function checkSite(loc){
  if(!loc||loc.lat==null)return{status:"red",name:null,dist:null};
  var locs=(state.locations||[]),inside=null;
  locs.forEach(function(l){
    if(l.lat==null)return;
    var d=haversineMeters(loc.lat,loc.lng,l.lat,l.lng);
    if(d<=(l.radius||200)&&(!inside||d<inside.dist))inside={name:l.name,dist:Math.round(d),office:/bodega\s*tktk/i.test(l.name||"")};
  });
  if(inside)return{status:inside.office?"ok":"yellow",name:inside.name,dist:inside.dist};
  var nearest=null;
  locs.forEach(function(l){if(l.lat==null)return;var d=haversineMeters(loc.lat,loc.lng,l.lat,l.lng);if(!nearest||d<nearest.dist)nearest={name:l.name,dist:Math.round(d)};});
  return{status:"red",name:nearest?nearest.name:null,dist:nearest?nearest.dist:null};
}
function faceBadge(face){
  if(!face)return"";
  if(face.skipped)return' <span style="font-size:11px;color:#f5a623;font-weight:700;">⚠️ rostro s/verif.</span>';
  if(face.matched)return' <span style="font-size:11px;color:#27ae60;font-weight:700;">✅ '+face.confidence+'%</span>';

}

// Marcado con cámara (solo cámara, no galería) → foto → rostro → oficina → alerta si no coincide

// ── PRUEBA DE VIDA (liveness activo con reto aleatorio) ──
var _liveStream=null,_liveFrame1=null,_liveFrame2=null;
var LIVE_CHALLENGES=[
  {id:"ojos",instr:"CIERRA los ojos y mantenlos cerrados 👀"},
  {id:"boca",instr:"ABRE bien la boca y mantenla abierta 😮"}
];
function startLiveness(kind){
  var ch=LIVE_CHALLENGES[Math.floor(Math.random()*LIVE_CHALLENGES.length)];
  _liveFrame1=null;_liveFrame2=null;
  var ov=document.getElementById("live-overlay");
  ov.classList.remove("hidden");
  ov.innerHTML='<div class="live-box">'+
    '<video id="live-video" autoplay playsinline muted></video>'+
    '<div id="live-msg" class="live-msg">Preparando cámara…</div>'+
    '<div id="live-actions"></div>'+
    '<button class="live-cancel" onclick="cancelLiveness()">Cancelar</button>'+
  '</div>';
  navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}).then(function(stream){
    _liveStream=stream;var v=document.getElementById("live-video");if(v)v.srcObject=stream;
    var m=document.getElementById("live-msg");if(m)m.textContent="Mira a la cámara con la cara neutral";
    var a=document.getElementById("live-actions");if(a)a.innerHTML='<button class="btn btn-blue btn-block" onclick="liveStep2(\''+kind+'\',\''+ch.id+'\')">Comenzar</button>';
  }).catch(function(){toast("No se pudo abrir la cámara — revisa permisos","error");cancelLiveness();});
}
function grabFrame(){
  var v=document.getElementById("live-video");
  if(!v||!v.videoWidth)return null;
  var MAX=960,sc=Math.min(MAX/v.videoWidth,MAX/v.videoHeight,1);
  var cv=document.createElement("canvas");
  cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);
  cv.getContext("2d").drawImage(v,0,0,cv.width,cv.height);
  return cv.toDataURL("image/jpeg",.9);
}
function liveStep2(kind,chId){
  _liveFrame1=grabFrame();
  if(!_liveFrame1){toast("Cámara no lista, intenta de nuevo","error");return;}
  var ch=LIVE_CHALLENGES.filter(function(c){return c.id===chId;})[0];
  var msg=document.getElementById("live-msg"),acts=document.getElementById("live-actions");
  if(acts)acts.innerHTML="";
  var n=3;if(msg)msg.textContent=ch.instr+"  ("+n+")";
  var t=setInterval(function(){
    n--;
    if(n<=0){clearInterval(t);if(msg)msg.textContent="Capturando…";_liveFrame2=grabFrame();processLiveness(kind,chId);}
    else if(msg)msg.textContent=ch.instr+"  ("+n+")";
  },1000);
}
function stopLiveStream(){if(_liveStream){_liveStream.getTracks().forEach(function(t){t.stop();});_liveStream=null;}}
function closeLiveOverlay(){stopLiveStream();var ov=document.getElementById("live-overlay");if(ov){ov.classList.add("hidden");ov.innerHTML="";}}
function cancelLiveness(){closeLiveOverlay();toast("Marcado cancelado");}
function verifyLive(chId,d1,d2){
  if(!d1||!d2||!d1.faceFound||!d2.faceFound)return null;
  if(chId==="ojos")return d1.eyesOpen===true&&d2.eyesOpen===false;
  if(chId==="boca")return d1.mouthOpen===false&&d2.mouthOpen===true;
  var y1=(d1.headpose&&d1.headpose.yaw_angle)||0,y2=(d2.headpose&&d2.headpose.yaw_angle)||0;
  if(chId==="derecha"||chId==="izquierda")return Math.abs(y2-y1)>14;
  return false;
}
function processLiveness(kind,chId){
  stopLiveStream();
  var msg=document.getElementById("live-msg");if(msg)msg.textContent="Verificando prueba de vida…";
  if(!_liveFrame1||!_liveFrame2){toast("No se capturaron las fotos","error");cancelLiveness();return;}
  uploadDataUrl(_liveFrame1,"agendateam_asistencia",function(url1){
    if(!url1){toast("Error al subir la foto — intenta de nuevo","error");closeLiveOverlay();return;}
    uploadDataUrl(_liveFrame2,"agendateam_asistencia",function(url2){
      Promise.all([faceDetect(url1),faceDetect(url2||url1)]).then(function(r){
        var d1=r[0],d2=r[1],live={challenge:chId,skipped:false,live:false};
        if((d1&&d1.skipped)||(d2&&d2.skipped))live.skipped=true;
        else{var v=verifyLive(chId,d1,d2);if(v===null)live.skipped=true;else live.live=v;}
        // NO registrar si no pasa la prueba de vida
        if(live.live){closeLiveOverlay();registrarAsistencia(kind,url1,live);}
        else livenessFailed(kind,live.skipped,d1,d2,chId);
      });
    });
  });
}
function livenessFailed(kind,skipped,d1,d2,chId){
  var ov=document.getElementById("live-overlay");if(!ov)return;
  ov.classList.remove("hidden");
  function dd(d){if(!d)return"?";if(d.skipped)return"skip("+(d.reason||"api")+")";if(!d.faceFound)return"SIN ROSTRO";return"ojos="+d.eyesOpen+" boca="+d.mouthOpen+" yaw="+(d.headpose?Math.round(d.headpose.yaw_angle):"?");}
  var diag='reto='+(chId||"?")+'  f1['+dd(d1)+']  f2['+dd(d2)+']';
  ov.innerHTML='<div class="live-box">'+
    '<div style="font-size:56px;">🚫</div>'+
    '<div class="live-msg">'+(skipped?"No se detectó tu rostro o no se pudo verificar la prueba de vida.":"No pasaste la prueba de vida.")+'<br><span style="font-size:14px;color:#ffb3b3;">No se puede registrar el '+(kind==="in"?"ingreso":"salida")+'.</span></div>'+
    '<div style="font-size:11px;color:#aab;background:rgba(255,255,255,.08);padding:8px 10px;border-radius:8px;word-break:break-word;text-align:center;">🔎 '+diag+'</div>'+
    '<div id="live-actions" style="width:100%;"><button class="btn btn-blue btn-block" onclick="startLiveness(\''+kind+'\')">🔄 Intentar de nuevo</button></div>'+
    '<button class="live-cancel" onclick="closeLiveOverlay()">Cancelar</button>'+
  '</div>';
}
function uploadDataUrl(dataUrl,folder,cb){
  var fd=new FormData();
  fd.append("file",dataUrl);fd.append("upload_preset",CLOUDINARY_PRESET);fd.append("folder",folder);
  var xhr=new XMLHttpRequest();
  xhr.open("POST","https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD+"/image/upload");
  xhr.onload=function(){var url="";try{url=JSON.parse(xhr.responseText).secure_url||"";}catch(e){}cb(url);};
  xhr.onerror=function(){cb("");};
  xhr.send(fd);
}
function faceDetect(url){
  return fetch("/.netlify/functions/facedetect",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({imageUrl:cloudinaryForAI(url)})}).then(function(r){return r.json();}).catch(function(){return{skipped:true};});
}
function liveBadge(live){
  if(!live)return"";
  if(live.skipped)return' <span style="font-size:11px;color:#f5a623;font-weight:700;">🫥 vida s/verif.</span>';
  if(live.live)return' <span style="font-size:11px;color:#27ae60;font-weight:700;">🟢 vida ✓</span>';

}

  xhr.onload=function(){
    var url="";try{var r=JSON.parse(xhr.responseText);url=r.secure_url||"";}catch(e){}
    if(!url){toast("Error al subir la foto — intenta de nuevo","error");return;}
    registrarAsistencia(kind,url,null);

function attById(id){return(state.attendance||[]).find(function(x){return String(x.id)===String(id);});}
function registrarAsistencia(kind,photoUrl,live){
  var cid=myUid();if(!cid)return;
  var rec=todayAttendance(cid);
  if(!rec){rec={id:Date.now(),collabId:cid,collabName:myName(),date:todayKey()};state.attendance.push(rec);}
  var recId=rec.id;
  if(kind==="in"){rec.inTime=Date.now();rec.inPhoto=photoUrl||null;rec.inLive=live||null;}
  else{rec.outTime=Date.now();rec.outPhoto=photoUrl||null;rec.outLive=live||null;}
  saveLocal();if(db)saveCloud();renderIngreso();
  getGeo(function(loc){
    var r=attById(recId);if(!r)return; // re-buscar el registro vivo (onSnapshot pudo reemplazar el arreglo)
    if(kind==="in"){r.inLoc=loc||r.inLoc||null;r.inSite=checkSite(r.inLoc);}
    else{r.outLoc=loc||r.outLoc||null;r.outSite=checkSite(r.outLoc);}
    evalAttendanceFlags(r,kind);
    saveLocal();if(db)saveCloud();if(currentTab==="ingreso")renderIngreso();
  });
  var profile=currentUser&&currentUser.photo;
  if(profile&&photoUrl){
    checkFaceIdentity(profile,photoUrl).then(function(res){
      var r=attById(recId);if(!r)return; // re-buscar el registro vivo antes de escribir el resultado facial
      var face={matched:!!(res&&res.matched),confidence:Math.round((res&&res.confidence)||0),skipped:!!(res&&res.skipped)};
      if(kind==="in")r.inFace=face;else r.outFace=face;
      evalAttendanceFlags(r,kind);
      saveLocal();if(db)saveCloud();if(currentTab==="ingreso")renderIngreso();
      if(face.skipped)toast("⚠️ Rostro no verificado");
      else if(face.matched)toast("✅ Identidad verificada ("+face.confidence+"%)");
      else toast("❌ El rostro no coincide — se creó alerta","error");
    });
  }
  toast((kind==="in"?"✅ Ingreso ":"✅ Salida ")+fmtTime(kind==="in"?rec.inTime:rec.outTime));
}
function evalAttendanceFlags(rec,kind){
  var face=kind==="in"?rec.inFace:rec.outFace;
  var site=kind==="in"?rec.inSite:rec.outSite;
  var live=kind==="in"?rec.inLive:rec.outLive;
  var reasons=[];
  // Rostro que no coincide = rojo (identidad)
  if(face&&!face.skipped&&!face.matched)reasons.push({t:"Rostro no coincide"+(face.confidence?" ("+face.confidence+"%)":""),lvl:"red"});
  // Sin prueba de vida = rojo (posible suplantación con foto)
  if(live&&!live.skipped&&live.live===false)reasons.push({t:"Sin prueba de vida (posible suplantación)",lvl:"red"});
  // Ubicación: BODEGA TKTK ok · otro sitio = amarillo · ninguno = rojo
  if(site){
    if(site.status==="yellow")reasons.push({t:"Marcó desde "+site.name+" (no es BODEGA TKTK)",lvl:"yellow"});
    else if(site.status==="red")reasons.push({t:(site.name?"Fuera de todo sitio · cerca "+site.name+" "+site.dist+"m":"Sin ubicación / fuera de todo sitio"),lvl:"red"});
  }
  if(kind==="in")rec.inFlags=reasons;else rec.outFlags=reasons;
  var all=(rec.inFlags||[]).concat(rec.outFlags||[]);
  rec.needsValidation=all.length>0;
  rec.flagLevel=all.some(function(r){return r.lvl==="red";})?"red":(all.length?"yellow":null);
  if(rec.needsValidation&&rec.validation!=="aprobado"&&rec.validation!=="rechazado")rec.validation="pendiente";
  var af=kind==="in"?"_alertedIn":"_alertedOut";
  if(reasons.length&&!rec[af]){rec[af]=true;crearAlertaValidacion(rec,kind,reasons);}
}
function crearAlertaValidacion(rec,kind,reasons){
  if(!state.alerts)state.alerts=[];
  var txt=reasons.map(function(r){return r.t;});
  var lvl=reasons.some(function(r){return r.lvl==="red";})?"red":"yellow";
  state.alerts.push({id:Date.now()+"_"+kind,type:"attendance_flag",attId:rec.id,kind:kind,level:lvl,collabName:rec.collabName,date:rec.date,reasons:txt,ts:Date.now(),resolved:false});
  try{sendNotif("boss",(lvl==="red"?"🔴":"🟡")+" Asistencia por validar",rec.collabName+" ("+(kind==="in"?"ingreso":"salida")+"): "+txt.join(", "));}catch(e){}
}

    '<div style="font-size:11px;color:#777;">Ingreso: '+locLabel(a.inLoc)+siteStr(a.inSite)+'</div>'+
    (a.outLoc?'<div style="font-size:11px;color:#777;">Salida: '+locLabel(a.outLoc)+siteStr(a.outSite)+'</div>':'')+

    (actionable?
      '<div style="display:flex;gap:8px;">'+
        '<button class="btn btn-sm" style="flex:1;background:linear-gradient(135deg,#27ae60,#219150);color:#fff;" onclick="validarAsistencia('+a.id+',true)">✔ Aprobar</button>'+
        '<button class="btn btn-sm" style="flex:1;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;" onclick="validarAsistencia('+a.id+',false)">✖ Rechazar</button>'+
      '</div>':

function validarAsistencia(id,ok){

  if(!rec)return;
  rec.validation=ok?"aprobado":"rechazado";rec.validatedBy=myName();rec.validatedAt=Date.now();

  saveLocal();if(db)saveCloud();renderValidacion();
  toast(ok?"✔ Registro aprobado":"✖ Registro rechazado");
}
function pendValidCount(){return(state.attendance||[]).filter(function(a){return a.needsValidation&&a.validation==="pendiente";}).length+(state.activities||[]).filter(function(a){return a.needsValidation&&a.validation==="pendiente";}).length;}

// ── ACTIVIDADES (horas por tarea, con ubicación) ──
function myActivityNames(cid){var m={};(state.activities||[]).forEach(function(a){if(a.collabId===cid&&a.name)m[a.name]=true;});return Object.keys(m);}
// Estandarización de actividades: variantes/sinónimos = UNA sola (almorzar/almuercito/almuerzo = "Almuerzo")
function normActName(s){return String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ");}
var ACT_ALIASES={
  "Almuerzo":["almuerzo","almuerzos","almorzar","almorzando","almuercito","almuersito","almuerso","almuerzito","hora de almuerzo","ir a almorzar","lonche","almuerz"]
};
function _aliasMap(){var r={};Object.keys(ACT_ALIASES).forEach(function(c){r[normActName(c)]=c;(ACT_ALIASES[c]||[]).forEach(function(al){r[normActName(al)]=c;});});return r;}
function _lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function canonName(name){var al=_aliasMap();return al[normActName(name)]||String(name||"").trim();}
function isHomeOfficeName(name){return /^\s*home\s*office/i.test(String(name||""));}
// Home Office: visible sólo para su creador, el validador y Manuel (jefe)
function actVisible(a){
  if(!isHomeOfficeName(a.name))return true;
  if(isAdmin())return true; // jefe o validador
  return String(a.collabId)===String(myUid()); // el creador
}
function canonicalActivities(){var m={};(state.activities||[]).forEach(function(a){if(!a.name||!actVisible(a))return;var cn=canonName(a.name),k=normActName(cn);if(k&&!m[k])m[k]=cn;});return m;}
function canonicalActivityNames(){var m=canonicalActivities();return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.localeCompare(b);});}
function lastUsedActivity(cid){var mine=(state.activities||[]).filter(function(a){return String(a.collabId)===String(cid)&&a.name;});if(!mine.length)return null;mine.sort(function(a,b){return(b.startTs||0)-(a.startTs||0);});return canonName(mine[0].name);}
// Proyectos/sitios registrados con ubicación (incluida la bodega). "CASA" solo la ve el jefe.
function projectOptions(){
  var boss=currentUser&&currentUser.type==="boss";
  return (state.locations||[]).filter(function(l){
    if(!l||l.lat==null||!l.name)return false;
    if(!boss&&normActName(l.name)==="casa")return false; // CASA solo para Manuel
    return true;
  }).map(function(l){return l.name;});
}
function isProject(name){var k=normActName(name);return projectOptions().some(function(p){return normActName(p)===k;});}
function isHomeOffice(name){return normActName(name)==="home office";}
// Orden del dropdown: 1a = última utilizada · 2a = Almuerzo (fija) · proyectos con ubicación · resto
function activityOptions(cid){
  var set={},list=[];
  function add(n){if(!n)return;var k=normActName(n);if(!set[k]){set[k]=1;list.push(n);}}
  add(lastUsedActivity(cid));
  add("Almuerzo");
  add("Home Office");
  projectOptions().forEach(add);
  canonicalActivityNames().forEach(add);
  return list;
}
function standardizeName(name){
  var k=normActName(name);if(!k)return String(name||"").trim();
  var al=_aliasMap();if(al[k])return al[k];
  var canon=canonicalActivities();if(canon[k])return canon[k];
  // fuzzy sólo para typos de nombres largos (evita fusionar palabras cortas distintas)
  if(k.length>=6){
    var best=null,bestD=99;
    Object.keys(al).forEach(function(ak){var dd=_lev(k,ak);if(dd<bestD){bestD=dd;best=al[ak];}});
    Object.keys(canon).forEach(function(ck){var dd=_lev(k,ck);if(dd<bestD){bestD=dd;best=canon[ck];}});
    if(best&&bestD<=2)return best;
  }
  return String(name||"").trim();
}
function actSelChanged(v){
  var nw=document.getElementById("act-new-wrap"),dw=document.getElementById("act-detail-wrap");
  if(nw)nw.style.display=(v==="__new__")?"block":"none";
  if(dw)dw.style.display=(isProject(v)||isHomeOffice(v))?"block":"none";
}
function iniciarActividad(){
  var sel=document.getElementById("act-select"),v=sel?sel.value:"",name="",project="",special=false;
  if(v==="__new__"){var inp=document.getElementById("act-name");name=(inp?inp.value:"").trim();}
  else if(v&&(isProject(v)||isHomeOffice(v))){
    special=true;
    var det=document.getElementById("act-detail"),detail=(det?det.value:"").trim();
    name=detail?(v+" — "+detail):v;
    if(isProject(v))project=v; // sólo los proyectos validan ubicación; Home Office no
  }else name=(v||"").trim();
  if(!name){toast("Elige o escribe una actividad","error");return;}
  if(!special)name=standardizeName(name); // estandariza actividades libres; proyectos/Home Office van tal cual
  var cid=myUid();if(!cid)return;
  // Solo puede haber UNA actividad en curso: cerrar automáticamente la anterior
  var prev=(state.activities||[]).find(function(a){return a.collabId===cid&&!a.endTs;});
  if(prev){
    prev.endTs=Date.now();
    prev.endLoc=(_lastGeo&&Date.now()-(_lastGeo.ts||0)<120000)?_lastGeo:prev.endLoc||null;
    toast("⏹️ "+prev.name+" cerrada automáticamente");
  }
  var ent={id:Date.now(),collabId:cid,collabName:myName(),name:name,project:project||null,date:todayKey(),startTs:Date.now(),endTs:null,startLoc:null,endLoc:null};
  state.activities.push(ent);
  saveLocal();if(db)saveCloud();renderActividades();
  toast("📍 Registrando ubicación…");
  var entId=ent.id;
  getGeo(function(loc){
    var e=actById(entId)||ent; // re-buscar el registro vivo (onSnapshot puede reemplazar el arreglo)
    e.startLoc=loc||e.startLoc||null;
    if(e.project)evalActivitySite(e); // validar que el GPS concuerde con el sitio elegido
    saveLocal();if(db)saveCloud();if(currentTab==="actividades")renderActividades();
  });
  toast("▶️ "+name+" iniciada");
}
function actById(id){return(state.activities||[]).find(function(x){return String(x.id)===String(id);});}
function checkNamedSite(loc,siteName){
  var l=(state.locations||[]).find(function(x){return normActName(x.name)===normActName(siteName);});
  if(!l||l.lat==null)return null;
  if(!loc||loc.lat==null)return{name:l.name,dist:null,radius:l.radius||200,within:false,noloc:true};
  var d=Math.round(haversineMeters(loc.lat,loc.lng,l.lat,l.lng));
  return{name:l.name,dist:d,radius:l.radius||200,within:d<=(l.radius||200)};
}
// Bases desde las que SÍ se puede trabajar en otro proyecto sin alarma: BODEGA TKTK y BODEGA NICARAGUA
function atWorkBase(loc){
  if(!loc||loc.lat==null)return null;var hit=null;
  (state.locations||[]).forEach(function(l){
    if(l.lat==null||!(/bodega\s*tktk/i.test(l.name||"")||/bodega\s*nicaragua/i.test(l.name||"")))return;
    var d=haversineMeters(loc.lat,loc.lng,l.lat,l.lng);
    if(d<=(l.radius||200)&&(!hit||d<hit.dist))hit={name:l.name,dist:Math.round(d)};
  });
  return hit;
}
function clearActFlag(e){e.needsValidation=false;e.flagLevel=null;e.flags=[];(state.alerts||[]).forEach(function(al){if(al.type==="activity_flag"&&String(al.actId)===String(e.id))al.resolved=true;});}
function evalActivitySite(e){
  var chk=checkNamedSite(e.startLoc,e.project);e.siteCheck=chk;
  if(!chk){clearActFlag(e);e.fromBase=null;return;}
  if(chk.within===true){clearActFlag(e);e.fromBase=null;return;} // está en el sitio elegido
  var base=atWorkBase(e.startLoc); // no está en el sitio: ¿está en una bodega base?
  if(base){clearActFlag(e);e.fromBase=base.name;return;} // permitido: trabaja desde la bodega
  e.fromBase=null;
  e.flags=[chk.noloc?("Sin ubicación para validar "+e.project):("Fuera de "+chk.name+" ("+chk.dist+"m)")];
  e.needsValidation=true;e.flagLevel="red";
  if(e.validation!=="aprobado"&&e.validation!=="rechazado")e.validation="pendiente";
  if(!e._alerted){e._alerted=true;crearAlertaActividad(e);}
}
function crearAlertaActividad(e){
  if(!state.alerts)state.alerts=[];
  state.alerts.push({id:Date.now()+"_act",type:"activity_flag",actId:e.id,collabName:e.collabName,date:e.date,activity:e.name,reasons:e.flags||[],level:"red",ts:Date.now(),resolved:false});
  try{sendNotif("boss","🔴 Actividad fuera de sitio",e.collabName+": "+(e.flags||[]).join(", "));}catch(err){}
}
function cerrarActividad(id){
  var ent=(state.activities||[]).find(function(a){return a.id===id;});
  if(!ent||ent.endTs)return;
  ent.endTs=Date.now();
  saveLocal();if(db)saveCloud();renderActividades();
  toast("📍 Registrando ubicación…");
  var entId=ent.id;
  getGeo(function(loc){var e=actById(entId)||ent;e.endLoc=loc||e.endLoc||null;saveLocal();if(db)saveCloud();if(currentTab==="actividades")renderActividades();});
  toast("⏹️ "+ent.name+" · "+fmtDur(ent.endTs-ent.startTs));
}
function actSiteStr(a){
  if(!a.siteCheck)return'';
  if(a.siteCheck.within)return siteStr({status:"ok",name:a.siteCheck.name,dist:a.siteCheck.dist});
  if(a.fromBase)return' · <span style="color:#4a6cf7;font-weight:700;">🏢 desde '+escH(a.fromBase)+'</span>';

function actRow(a){

    (a.needsValidation?'<div style="'+flagStyle("red")+'border-radius:8px;padding:5px 8px;margin-top:4px;font-size:11px;font-weight:600;">🔴 '+escH((a.flags||[]).join(" · "))+(a.validation==="aprobado"?" — ✔ aprobado":a.validation==="rechazado"?" — ✖ rechazado":"")+'</div>':'')+
  '</div>';

// Cumplimiento por día (últimos 30 días) — verde/amarillo/rojo
function taskDayResults(t){
  var cutoff=Date.now()-30*86400000,byDay={};
  (t.history||[]).forEach(function(hh){
    if((hh.ts||0)<cutoff)return;
    var d=hh.date||"",rk=hh.result==="green"?2:(hh.result==="yellow"?1:0);
    if(!(d in byDay)||rk>byDay[d])byDay[d]=rk;
  });
  var c=0,p=0,r=0;
  Object.keys(byDay).forEach(function(d){var rk=byDay[d];if(rk===2)c++;else if(rk===1)p++;else r++;});
  return{cumplido:c,parcial:p,incumplido:r};
}
function taskBarsChartHTML(group){
  var data=group.map(function(t){var r=taskDayResults(t);return{title:t.title,c:r.cumplido,p:r.parcial,r:r.incumplido};});
  var maxV=1;data.forEach(function(d){maxV=Math.max(maxV,d.c+d.p,d.r);});
  var HALF=80;
  var cols=data.map(function(d){
    var gH=Math.round(d.c/maxV*HALF),yH=Math.round(d.p/maxV*HALF),rH=Math.round(d.r/maxV*HALF);
    return'<div style="flex:1;min-width:48px;display:flex;flex-direction:column;align-items:center;">'+
      '<div style="height:'+(HALF+16)+'px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;width:100%;">'+
        ((d.c+d.p)?'<div style="font-size:10px;font-weight:800;color:#27ae60;margin-bottom:2px;">'+(d.c+d.p)+'</div>':'')+
        (yH?'<div style="width:70%;max-width:34px;height:'+yH+'px;background:#f5a623;" title="parcial: '+d.p+'"></div>':'')+
        (gH?'<div style="width:70%;max-width:34px;height:'+gH+'px;background:#27ae60;border-radius:4px 4px 0 0;" title="cumplido: '+d.c+'"></div>':'')+
      '</div>'+
      '<div style="height:2px;width:100%;background:#cfd4e0;"></div>'+
      '<div style="height:'+(HALF+16)+'px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;width:100%;">'+
        (rH?'<div style="width:70%;max-width:34px;height:'+rH+'px;background:#e74c3c;border-radius:0 0 4px 4px;" title="incumplido: '+d.r+'"></div>':'')+
        (d.r?'<div style="font-size:10px;font-weight:800;color:#e74c3c;margin-top:2px;">'+d.r+'</div>':'')+
      '</div>'+
      '<div style="font-size:10px;color:#666;text-align:center;margin-top:4px;line-height:1.15;height:28px;overflow:hidden;">'+escH((d.title||"").slice(0,20))+'</div>'+
    '</div>';
  }).join("");
  return'<div class="card" style="overflow-x:auto;"><div style="display:flex;gap:8px;align-items:stretch;">'+cols+'</div></div>';
}
function estadTareasHTML(isBoss,cid){

function updStat(id,status){
  var t=state.tasks.find(function(x){return x.id==id;});
  if(!t)return;
  var prevStatus=t.status;
  // Si el colaborador marca completada y la tarea tiene criterios → pedir reporte
  var isBoss=currentUser&&currentUser.type==="boss";
  if(status==="completada"&&!isBoss&&t.criteria&&t.criteria.trim()&&prevStatus!=="completada"){
    showCompletionReport(id);
    return;
  }
  // Cycle validation
  if(status==="completada"&&prevStatus!=="completada"){
    var cs=cycleStart(t);
    var alreadyDone=(t.history||[]).some(function(h){return h.ts>=cs;});
    if(alreadyDone){toast("Ya se registró un ciclo completado en este período","error");return;}
    if(!t.history)t.history=[];
    var now=new Date();
    var result="green";
    if(t.endDate){
      var due=taskDue(t);
      var diff=now.getTime()-due;
      if(diff>0&&diff<=OT[t.frequency||"diaria"])result="yellow";
      else if(diff>OT[t.frequency||"diaria"])result="red";
    }
    t.history.push({date:now.toLocaleDateString("es"),ts:now.getTime(),result:result});
    if(t.history.length>20)t.history=t.history.slice(-20);
  }
  t.status=status;
  saveLocal();render();toast("Estado actualizado ✓");
}

function seqSelectPhoto(file,fromCamera){
  if(!file)return;
  _seqPhotoFile=file;
  var preview=document.getElementById("seq-preview");
  if(preview){preview.innerHTML='<img src="'+URL.createObjectURL(file)+'" style="max-height:180px;max-width:100%;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.15);">';}
  var btn=document.getElementById("seq-submit-btn");
  if(btn){btn.disabled=false;btn.style.opacity="1";}
  if(fromCamera&&navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      _seqPhotoCoord={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};
    },function(){_seqPhotoCoord=null;},{timeout:4000,maximumAge:30000});
  }else{_seqPhotoCoord=null;}
}
function submitSeqPhoto(taskId){
  if(!_seqPhotoFile){toast("Selecciona una foto primero","error");return;}
  var t=state.tasks.find(function(x){return x.id==taskId;});
  if(!t)return;
  var prog=document.getElementById("seq-upload-prog");
  var btn=document.getElementById("seq-submit-btn");
  if(prog)prog.style.display="block";
  if(btn){btn.disabled=true;btn.textContent="Validando…";}
  var photoIndex=(t.photoProgress||[]).length+1;
  uploadEvidence("seq_"+taskId,[_seqPhotoFile],[_seqPhotoCoord||null],null,function(urls){
    var att=urls[0];
    if(!att||!att.url){if(prog)prog.style.display="none";toast("Error al subir la foto","error");return;}
    validateSeqPhoto(taskId,att,photoIndex);
  },function(err){
    if(prog)prog.style.display="none";
    toast("Error al subir: "+err,"error");
    var btn2=document.getElementById("seq-submit-btn");
    if(btn2){btn2.disabled=false;btn2.style.opacity="1";btn2.textContent="Enviar foto "+photoIndex+"/"+(t.photoCount||20);}
  });
}
function validateSeqPhoto(taskId,att,photoIndex){
  var t=state.tasks.find(function(x){return x.id==taskId;});
  if(!t)return;
  var total=t.photoCount||20;
  var col=state.collaborators.find(function(c){return Array.isArray(t.assignedTo)?t.assignedTo.indexOf(c.id)>=0:c.id===t.assignedTo;});
  var ck=t.isGroup&&t.groupKey?t.groupKey:(col?collabCK(col.id):null);
  var rawCriteria=t.criteria||"Verificar que la foto sea correcta y corresponda a la tarea: "+t.title;
  var criteriaLines=rawCriteria.split(/\n/).filter(function(s){return s.trim();}).map(function(s,i){return(i+1)+". "+s.trim();}).join("\n");
  var sys="Validador de foto AgendaTeam. Tarea: \""+t.title+"\". Foto "+photoIndex+" de "+total+".\n"+
    "Criterios:\n"+criteriaLines+"\n"+
    "Evalúa si esta foto cumple los criterios. Responde SOLO JSON: "+
    "{\"aprobada\":true/false,\"razon\":\"motivo corto\",\"detalle\":\"descripción de lo que se ve en la foto y si cumple o no\"}";
  var content=[{type:"image",source:{type:"url",url:cloudinaryForAI(att.url)}},{type:"text",text:"Valida esta foto."}];
  if(ck&&state.messages[ck])state.messages[ck].push({id:Date.now(),from:"system",type:"seq_validating",ts:Date.now(),
    text:"📷 Validando foto "+photoIndex+"/"+total+" de \""+t.title+"\"…"});
  saveLocal();
  fetch("/.netlify/functions/claude",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:400,system:sys,messages:[{role:"user",content:content}]})
  }).then(function(r){return r.json();}).then(function(d){
    t=state.tasks.find(function(x){return x.id==taskId;});if(!t)return;
    var raw=(d.content&&d.content[0]&&d.content[0].text)||"";
    var result={};try{var m=raw.match(/\{[\s\S]*\}/);result=m?JSON.parse(m[0]):{};} catch(e){}
    var ok=result.aprobada===true;
    var razon=result.razon||result.detalle||(ok?"Foto aprobada.":"Foto no válida.");
    if(ok){
      if(!t.photoProgress)t.photoProgress=[];
      t.photoProgress.push({att:att,date:new Date().toLocaleDateString("es"),ts:Date.now(),photoIndex:photoIndex});
      var remaining=total-t.photoProgress.length;
      if(ck&&state.messages[ck])state.messages[ck].push({id:Date.now(),from:"ai",type:"seq_ok",ts:Date.now(),
        text:"✅ Foto "+photoIndex+"/"+total+" aprobada — "+razon+(remaining>0?" Continúa con la foto "+(photoIndex+1)+".":"\n\n🎉 ¡Todas las fotos completadas!")});
      if(remaining<=0){
        // Todas las fotos tomadas → completar tarea
        t.status="completada";
        if(!t.history)t.history=[];
        var res2=t.endDate&&taskDue(t)<Date.now()?"red":"green";
        var allAtts=t.photoProgress.map(function(p){return p.att;});
        t.history.push({date:new Date().toLocaleDateString("es"),ts:Date.now(),result:res2,approved:true,report:"Fotos secuenciales: "+total+" fotos validadas.",attachments:allAtts,criteriaResults:[]});
        if(t.history.length>20)t.history=t.history.slice(-20);
        sendNotif("boss","✅ Fotos completadas","\""+t.title+"\""+(col?" — "+col.name:"")+": "+total+" fotos aprobadas.");
        saveLocal();if(db)saveCloud();render();
        var prev=document.getElementById("completion-sheet");if(prev)prev.remove();
        toast("✅ ¡"+total+" fotos completadas y aprobadas!");
      }else{
        saveLocal();if(db)saveCloud();render();
        var prev=document.getElementById("completion-sheet");if(prev)prev.remove();
        showSeqPhotoSheet(taskId,"Foto "+photoIndex+" aprobada: "+razon+". Avanza con la foto "+(photoIndex+1)+".","ok");
      }
    }else{
      if(ck&&state.messages[ck])state.messages[ck].push({id:Date.now(),from:"ai",type:"seq_fail",ts:Date.now(),
        text:"❌ Foto "+photoIndex+"/"+total+" rechazada — "+razon+". Vuelve a tomar la foto y asegúrate de que cumpla el criterio."});
      saveLocal();render();
      var prev=document.getElementById("completion-sheet");if(prev)prev.remove();
      showSeqPhotoSheet(taskId,razon+". Vuelve a tomar la foto correctamente.","err");
    }
  }).catch(function(e){
    var prev=document.getElementById("completion-sheet");if(prev)prev.remove();
    showSeqPhotoSheet(taskId,"Error de conexión. Intenta de nuevo.","err");
  });
}
function finalizeSeqTask(taskId){
  var t=state.tasks.find(function(x){return x.id==taskId;});

  t.status="completada";

  saveLocal();if(db)saveCloud();render();
}

function addEvidenceFiles(files){
  Array.from(files).forEach(function(f){_evidenceFiles.push(f);_evidenceCoords.push(null);});
  renderEvidencePreview();
}
function addCameraFiles(files){
  var fileArray=Array.from(files);
  if(!fileArray.length)return;
  // Agregar archivos INMEDIATAMENTE con coords null para que la preview y el envío no queden bloqueados
  var startIdx=_evidenceFiles.length;
  fileArray.forEach(function(f){_evidenceFiles.push(f);_evidenceCoords.push(null);});
  renderEvidencePreview();
  if(navigator.geolocation){
    toast("📍 Obteniendo ubicación…");
    navigator.geolocation.getCurrentPosition(function(pos){
      var coord={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy)};
      // Actualizar coords de las fotos recién añadidas
      for(var i=startIdx;i<startIdx+fileArray.length;i++){_evidenceCoords[i]=Object.assign({},coord);}
      renderEvidencePreview();
      // Geocodificación inversa con Nominatim (OpenStreetMap)
      fetch("https://nominatim.openstreetmap.org/reverse?lat="+coord.lat+"&lon="+coord.lng+"&format=json&accept-language=es",{headers:{"User-Agent":"AgendaTeam/1.0"}})
        .then(function(r){return r.json();}).then(function(geo){
          if(geo&&geo.address){
            var a=geo.address;
            var parts=[a.road||a.pedestrian||a.footway||"",a.neighbourhood||a.suburb||a.quarter||a.city_district||"",a.city||a.town||a.village||a.municipality||"",a.state||"",a.country||""].filter(Boolean);
            var address=parts.slice(0,4).join(", ");
            for(var i=startIdx;i<startIdx+fileArray.length;i++){if(_evidenceCoords[i])_evidenceCoords[i].address=address;}
            renderEvidencePreview();
          }
        }).catch(function(){});
    },function(){
      toast("Ubicación no disponible — verifica permisos GPS","warn");
      // Las fotos ya están en el array con coords null, no se bloquea el envío
    },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
  }
}

function renderEvidencePreview(){
  var el=document.getElementById("evidence-preview");
  if(!el)return;
  el.innerHTML=_evidenceFiles.map(function(f,i){
    var ftype=f.type||"";
    var fname=f.name||"";
    var fext=(fname.split(".").pop()||"").toLowerCase();
    var isImg=ftype.indexOf("image")>=0||["jpg","jpeg","png","gif","webp","heic","heif","bmp"].indexOf(fext)>=0;
    var icon=getFileIcon(ftype,fname);
    var preview=isImg?'<img src="'+URL.createObjectURL(f)+'" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">':'<div style="width:60px;height:60px;background:#f0f2f7;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;">'+icon+'</div>';
    var coord=_evidenceCoords[i];
    var pin=coord?'<div style="position:absolute;bottom:0;left:0;background:#27ae60;color:#fff;border-radius:0 4px 0 8px;padding:1px 4px;font-size:9px;font-weight:800;" title="'+(coord.address||coord.lat.toFixed(4)+","+coord.lng.toFixed(4))+'">📍'+(coord.address?"✓":"…")+'</div>':"";
    return'<div style="position:relative;cursor:pointer;" onclick="removeEvidence('+i+')">'+preview+pin+
      '<div style="position:absolute;top:-6px;right:-6px;background:#e74c3c;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;">✕</div>'+
      '<div style="font-size:10px;color:#888;text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escH(f.name)+'</div></div>';
  }).join("");
}

function removeEvidence(i){_evidenceFiles.splice(i,1);_evidenceCoords.splice(i,1);renderEvidencePreview();}
